  /* ============ ESTUDIO ============ */
  function listaEntregas(lista, conAcciones){
    var ul = document.createElement('ul');
    ul.className = 'entregas';
    lista.forEach(function(e){
      var dd = diasHasta(e.fecha);
      var hecha = e.estado === 'entregado';
      var li = document.createElement('li');
      li.className = (hecha ? 'hecha' : (dd >= 0 && dd <= 2 ? 'urgente' : (dd > 2 && dd <= 7 ? 'pronto' : '')));
      var txt = hecha ? 'listo' : (dd < 0 ? 'hace ' + (-dd) + 'd' : (dd === 0 ? 'hoy' : (dd === 1 ? 'mañana' : 'faltan')));
      var big = hecha ? '✓' : (dd < 0 ? '!' : (dd <= 1 ? cortoFecha(e.fecha).split(' ')[0] : dd));
      var sub = hecha ? 'entregado' : (dd <= 1 && dd >= 0 ? cortoFecha(e.fecha) : 'días');
      li.innerHTML = '<span class="cuenta"><b>'+esc(String(big))+'</b>'+esc(hecha ? txt : sub)+'</span>'+
        '<span class="t">'+esc(e.titulo)+'<small>'+
        esc([tipoFp(e.tipo).n, e.modulo, cortoFecha(e.fecha)].filter(Boolean).join(' · '))+'</small></span>'+
        '<button class="tick" aria-pressed="'+(hecha?'true':'false')+'" aria-label="Marcar entregado">'+
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4.5 4.5L19 7"/></svg></button>'+
        (conAcciones ? '<button class="tick" data-act="editar" aria-label="Editar entrega"><svg viewBox="0 0 24 24" aria-hidden="true" style="opacity:1"><path d="M4 20h4l10-10-4-4L4 16z"/></svg></button>' : '');
      li.querySelector('.tick:not([data-act])').addEventListener('click', function(){
        var x = clone(fp());
        x.entregas.forEach(function(y){ if(y.id === e.id) y.estado = (y.estado === 'entregado' ? 'pendiente' : 'entregado') });
        saveFp(x); render();
      });
      var ed = li.querySelector('[data-act="editar"]');
      if(ed) ed.addEventListener('click', function(){
        state.editandoEntrega = state.editandoEntrega === e.id ? null : e.id;
        state.nuevaEntrega = false;
        render();
      });
      ul.appendChild(li);
      if(conAcciones && state.editandoEntrega === e.id){
        var liEd = document.createElement('li');
        liEd.className = 'editor';
        liEd.appendChild(editorEntrega(e, function(){ state.editandoEntrega = null; render() }));
        ul.appendChild(liEd);
      }
    });
    return ul;
  }

  function editorEntrega(e, alTerminar){
    var nueva = !e || e.nuevo === true;
    var pre = e || {};
    if(nueva) e = null;
    var form = document.createElement('form');
    form.className = 'newblock';
    var mods = nombresModulos();
    if(e && e.modulo && mods.indexOf(e.modulo) < 0) mods.push(e.modulo);
    var opcMod = ['<option value="">Sin módulo</option>'].concat(mods.map(function(m){
      return '<option value="'+esc(m)+'"'+(e && e.modulo === m ? ' selected' : '')+'>'+esc(m)+'</option>';
    })).join('');
    var opcTipo = Object.keys(TIPOS_FP).map(function(t){
      return '<option value="'+t+'"'+(e && e.tipo === t ? ' selected' : (!e && t === 'entrega' ? ' selected' : ''))+'>'+TIPOS_FP[t].n+'</option>';
    }).join('');
    var suf = e ? e.id : 'nueva';
    form.innerHTML =
      '<label class="wide">Qué hay que entregar<input type="text" name="titulo" id="fp-t-'+suf+'" value="'+esc(e ? e.titulo : '')+'" placeholder="Práctica 2 de neumática" required></label>'+
      '<label class="wide">Fecha límite<input type="date" name="fecha" id="fp-f-'+suf+'" value="'+esc(e ? e.fecha : (pre.fecha || iso(new Date())))+'" required></label>'+
      '<label>Tipo<select name="tipo" id="fp-ti-'+suf+'">'+opcTipo+'</select></label>'+
      '<label>Módulo<select name="modulo" id="fp-m-'+suf+'">'+opcMod+'</select></label>'+
      '<label class="wide">Nota<input type="text" name="nota" id="fp-n-'+suf+'" value="'+esc(e && e.nota ? e.nota : '')+'" placeholder="Formato, dónde se sube, qué falta…"></label>'+
      '<div class="acciones">'+
        '<button class="btn primary" type="submit">'+(e ? 'Guardar cambios' : 'Añadir')+'</button>'+
        (e ? '<button class="btn danger" type="button" data-act="borrar">Borrar</button>' : '')+
        '<button class="btn" type="button" data-act="cancelar">Cancelar</button>'+
      '</div>';
    form.addEventListener('submit', function(ev){
      ev.preventDefault();
      var t = form.titulo.value.trim();
      if(!t){ toast('Ponle un título'); return }
      var x = clone(fp());
      var reg = e ? x.entregas.filter(function(y){ return y.id === e.id })[0] : null;
      if(!reg){ reg = {id: (e && e.id) || uid(), estado:'pendiente'}; x.entregas.push(reg) }
      reg.titulo = t;
      reg.fecha = form.fecha.value || iso(new Date());
      reg.tipo = form.tipo.value;
      reg.modulo = form.modulo.value;
      if(form.nota.value.trim()) reg.nota = form.nota.value.trim(); else delete reg.nota;
      saveFp(x);
      toast(e ? 'Fecha actualizada' : 'Entrega añadida');
      alTerminar();
    });
    form.querySelector('[data-act="cancelar"]').addEventListener('click', alTerminar);
    var del = form.querySelector('[data-act="borrar"]');
    if(del) del.addEventListener('click', function(){
      if(!window.confirm('¿Borrar «'+e.titulo+'»?')) return;
      var x = clone(fp());
      x.entregas = x.entregas.filter(function(y){ return y.id !== e.id });
      saveFp(x); alTerminar();
    });
    return form;
  }

  function viewEstudio(){
    var s = stack();
    var pend = entregas().filter(function(e){ return e.estado !== 'entregado' && diasHasta(e.fecha) >= 0 });
    var siguiente = pend[0];
    s.appendChild(banner({
      img:'estudio', alt:'Carretera de la serranía al atardecer', title:'Estudio', eyebrow: fp().nombre || 'Clases y entregas',
      sub: siguiente
        ? 'Lo siguiente: ' + siguiente.titulo + ' · ' + (function(dd){
            return dd === 0 ? 'hoy' : (dd === 1 ? 'mañana' : 'en ' + dd + ' días');
          })(diasHasta(siguiente.fecha))
        : 'Sin entregas pendientes apuntadas',
      chips: pend.length ? '<span class="chip">Pendientes <b>'+pend.length+'</b></span>' : ''
    }));
    s.appendChild(subtabs([['entregas','Entregas'],['calendario','Calendario'],['clases','Clases y audio']], state.subEstudio,
      function(k){ state.subEstudio = k; state.editandoEntrega = null; state.nuevaEntrega = false; render() }));

    if(state.subEstudio === 'calendario') return vistaCalendarioFp(s);
    if(state.subEstudio === 'clases') return vistaClases(s);

    /* --- lista de entregas --- */
    var todas = entregas();
    var hoyIso = iso(new Date());
    var grupos = [
      ['Esta semana', todas.filter(function(e){ var d2 = diasHasta(e.fecha); return e.estado !== 'entregado' && d2 >= 0 && d2 <= 7 })],
      ['Más adelante', todas.filter(function(e){ return e.estado !== 'entregado' && diasHasta(e.fecha) > 7 })],
      ['Atrasadas', todas.filter(function(e){ return e.estado !== 'entregado' && diasHasta(e.fecha) < 0 })],
      ['Hechas', todas.filter(function(e){ return e.estado === 'entregado' })]
    ];
    var hayAlgo = false;
    grupos.forEach(function(g){
      if(!g[1].length) return;
      hayAlgo = true;
      var c = card(g[0], g[1].length + (g[1].length === 1 ? ' cosa' : ' cosas'));
      c.body.appendChild(listaEntregas(g[1], true));
      s.appendChild(c);
    });
    if(!hayAlgo){
      s.appendChild(emptyCard('Todavía no hay nada apuntado. Añade abajo cada entrega, examen o práctica con su fecha límite y la verás aquí y en el calendario.'));
    }

    var ca = card('Añadir al curso');
    if(state.nuevaEntrega){
      ca.body.appendChild(editorEntrega(null, function(){ state.nuevaEntrega = false; render() }));
    } else {
      var ba = document.createElement('button');
      ba.className = 'btn primary'; ba.textContent = '+ Nueva entrega o examen';
      ba.addEventListener('click', function(){ state.nuevaEntrega = true; state.editandoEntrega = null; render() });
      ca.body.appendChild(ba);
      ca.body.appendChild(h('<div class="hint">Si el profesor mueve una fecha, entra en la entrega con el lápiz y cámbiala: el calendario y los avisos se ajustan solos.</div>').firstChild);
    }
    s.appendChild(ca);
    return s;
  }

  /* --- calendario con los días de entrega marcados --- */
  function vistaCalendarioFp(s){
    if(!state.mesFp) state.mesFp = iso(primerDiaMes(new Date()));
    var m = fechaDe(state.mesFp);
    var hoyIso = iso(new Date());
    var ini = mondayOf(new Date(m.getFullYear(), m.getMonth(), 1));
    var celdas = [];
    for(var i = 0; i < 42; i++){
      var dt = addDays(ini, i);
      celdas.push(dt);
      if(i >= 34 && dt.getMonth() !== m.getMonth() && (i+1) % 7 === 0) break;
    }

    var c = card('Mes');
    var head = c.querySelector('.head');
    head.innerHTML = '';
    var prev = document.createElement('button');
    prev.className = 'iconbtn'; prev.setAttribute('aria-label','Mes anterior');
    prev.innerHTML = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
    prev.addEventListener('click', function(){ state.mesFp = iso(new Date(m.getFullYear(), m.getMonth()-1, 1)); render() });
    var tit = document.createElement('h2');
    tit.style.textAlign = 'center';
    tit.textContent = MONTHS[m.getMonth()].charAt(0).toUpperCase() + MONTHS[m.getMonth()].slice(1) + ' ' + m.getFullYear();
    var next = document.createElement('button');
    next.className = 'iconbtn'; next.setAttribute('aria-label','Mes siguiente');
    next.innerHTML = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
    next.addEventListener('click', function(){ state.mesFp = iso(new Date(m.getFullYear(), m.getMonth()+1, 1)); render() });
    head.appendChild(prev); head.appendChild(tit); head.appendChild(next);

    var grid = document.createElement('div');
    grid.className = 'mes';
    ['L','M','X','J','V','S','D'].forEach(function(n){ grid.appendChild(h('<div class="cab">'+n+'</div>').firstChild) });

    var nMes = 0;
    celdas.forEach(function(dt){
      var di = iso(dt);
      var es = entregasDe(di);
      var cl = clasesDe(di);
      var hayExamen = es.some(function(e){ return e.tipo === 'examen' });
      var hayEntrega = es.length > 0;
      if(dt.getMonth() === m.getMonth()) nMes += es.length;
      var btn = document.createElement('button');
      btn.className = 'dia' + (dt.getMonth() !== m.getMonth() ? ' fuera' : '') +
        (di === hoyIso ? ' hoy' : '') + (di === state.diaFp ? ' sel' : '') +
        (hayExamen ? ' examen' : (hayEntrega ? ' entrega' : (cl.length ? ' clase' : '')));
      btn.setAttribute('aria-label', dt.getDate() + ' de ' + MONTHS[dt.getMonth()] + ': ' +
        (es.length ? es.length + ' entregas' : 'sin entregas') + (cl.length ? ', con clase' : ''));
      btn.innerHTML = '<span class="n">'+dt.getDate()+'</span>' +
        (hayEntrega ? '<span class="et">'+esc(es.length > 1 ? es.length + ' cosas' : tipoFp(es[0].tipo).n.toLowerCase())+'</span>'
                    : '<span class="ps">'+(cl.length ? '<i style="background:var(--c-estudio)"></i>' : '')+'</span>');
      btn.addEventListener('click', function(){
        state.diaFp = state.diaFp === di ? null : di;
        state.editandoEntrega = null; state.nuevaEntrega = false;
        render();
      });
      grid.appendChild(btn);
    });
    c.body.appendChild(grid);
    c.body.appendChild(h('<div class="leyenda">'+
      '<span><i style="background:#D1452F"></i>Día de entrega</span>'+
      '<span><i style="background:#8E2C3C"></i>Examen</span>'+
      '<span><i style="background:var(--c-estudio)"></i>Clase online</span></div>').firstChild);
    c.body.appendChild(h('<div class="hint">'+(nMes ? nMes+(nMes===1 ? ' cosa que entregar este mes.' : ' entregas este mes.')+' Toca un día para verlas o añadir una.' : 'Este mes no hay nada que entregar. Toca un día para apuntar algo.')+'</div>').firstChild);
    s.appendChild(c);

    if(state.diaFp){
      var dsel = fechaDe(state.diaFp);
      var cd = card(DAYNAMES[(dsel.getDay()+6)%7].charAt(0).toUpperCase() + DAYNAMES[(dsel.getDay()+6)%7].slice(1) + ' ' + dsel.getDate(),
                    state.diaFp === hoyIso ? 'hoy' : MONTHS[dsel.getMonth()]);
      var esd = entregasDe(state.diaFp);
      if(esd.length) cd.body.appendChild(listaEntregas(esd, true));
      else cd.body.innerHTML = '<div class="muted small">Ese día no hay nada que entregar.</div>';
      var cld = clasesDe(state.diaFp);
      if(cld.length){
        var ulc = document.createElement('ul'); ulc.className = 'horario'; ulc.style.marginTop = '10px';
        cld.forEach(function(x){
          ulc.appendChild(h('<li><span class="hh">'+esc(x.ini)+'–'+esc(x.fin)+'</span><span class="as">'+esc(x.asignatura || 'Clase online')+'</span></li>').firstChild);
        });
        cd.body.appendChild(ulc);
      }
      if(state.nuevaEntrega){
        cd.body.appendChild(editorEntrega({id:null, titulo:'', fecha:state.diaFp, tipo:'entrega', modulo:'', estado:'pendiente', nuevo:true},
          function(){ state.nuevaEntrega = false; render() }));
      } else {
        var bn = document.createElement('button');
        bn.className = 'btn primary'; bn.style.marginTop = '10px'; bn.textContent = '+ Añadir en este día';
        bn.addEventListener('click', function(){ state.nuevaEntrega = true; state.editandoEntrega = null; render() });
        cd.body.appendChild(bn);
      }
      s.appendChild(cd);
    }
    return s;
  }

  /* --- horario de clases, podcasts y biblioteca --- */
  function vistaClases(s){
    var cl = fp().clases.slice().sort(function(a,b){
      return Number(a.dia) - Number(b.dia) || mins(a.ini) - mins(b.ini);
    });
    var ch = card('Horario de clases', cl.length ? cl.length + ' a la semana' : 'sin horario');
    if(cl.length){
      var ul = document.createElement('ul'); ul.className = 'horario';
      cl.forEach(function(x, i){
        var li = document.createElement('li');
        li.innerHTML = '<span class="d">'+esc(DAYNAMES[Number(x.dia)-1] || '')+'</span>'+
          '<span class="hh">'+esc(x.ini)+'–'+esc(x.fin)+'</span>'+
          '<span class="as">'+esc(x.asignatura || 'Clase online')+'</span>'+
          '<button class="del" aria-label="Quitar clase">&times;</button>';
        li.querySelector('.del').addEventListener('click', function(){
          var xx = clone(fp());
          xx.clases = xx.clases.filter(function(y){
            return !(Number(y.dia) === Number(x.dia) && y.ini === x.ini && y.fin === x.fin);
          });
          saveFp(xx); render();
        });
        ul.appendChild(li);
      });
      ch.body.appendChild(ul);
    } else {
      ch.body.innerHTML = '<div class="muted small">Sin clases apuntadas.</div>';
    }
    var fh = document.createElement('form');
    fh.className = 'newblock';
    fh.innerHTML = '<label>Día<select name="dia" id="cl-dia">'+
      DAYNAMES.map(function(n,i){ return '<option value="'+(i+1)+'">'+n.charAt(0).toUpperCase()+n.slice(1)+'</option>' }).join('')+
      '</select></label>'+
      '<label>Desde<input type="time" name="ini" id="cl-ini" required></label>'+
      '<label>Hasta<input type="time" name="fin" id="cl-fin" required></label>'+
      '<label class="wide">Asignatura<input type="text" name="asignatura" id="cl-as" placeholder="Opcional"></label>'+
      '<div class="acciones"><button class="btn" type="submit">Añadir clase</button></div>';
    fh.addEventListener('submit', function(ev){
      ev.preventDefault();
      if(!validTime(fh.ini.value) || !validTime(fh.fin.value)){ toast('Faltan las horas'); return }
      var xx = clone(fp());
      xx.clases.push({dia:Number(fh.dia.value), ini:fh.ini.value, fin:fh.fin.value, asignatura:fh.asignatura.value.trim()});
      saveFp(xx); fh.reset(); render();
    });
    ch.body.appendChild(fh);
    s.appendChild(ch);

    var mods = fp().modulos;
    if(mods.length){
      var cm = card('Módulos del curso', mods.length + ' módulos');
      var ulm = document.createElement('ul'); ulm.className = 'kv';
      mods.forEach(function(mo){
        var nom = nombreModulo(mo);
        var n = entregas().filter(function(e){ return e.modulo === nom }).length;
        var det = [];
        if(mo && mo.semanas) det.push(mo.semanas + ' semanas de clase');
        if(mo && mo.practica) det.push('práctica presencial');
        if(mo && mo.fin) det.push('acaba el ' + cortoFecha(mo.fin));
        if(n) det.push(n + (n === 1 ? ' cosa apuntada' : ' cosas apuntadas'));
        ulm.appendChild(h('<li><span>'+esc(nom)+(det.length ? '<br><small style="color:var(--ink3); font-size:11.5px">'+esc(det.join(' · '))+'</small>' : '')+
          '</span><span class="v">'+(n || '—')+'</span></li>').firstChild);
      });
      cm.body.appendChild(ulm);
      cm.body.appendChild(h('<div class="hint">Las semanas sin clase en directo son de trabajo individual. La semana antes de cada examen hay clase de repaso.</div>').firstChild);
      s.appendChild(cm);
    }

    var carMin = 0;
    weekDates().forEach(function(dt){
      blocksOf(iso(dt)).forEach(function(b){ if(b.cat === 'trayecto') carMin += dur(b.ini,b.fin) });
    });
    var rec = d('recomendados');
    var items = (rec && rec.items) || [];
    var cr = card('Para el coche', carMin ? hrs(carMin) + ' de volante' : 'audio-estudio');
    if(items.length){
      items.forEach(function(it, i){
        var det = document.createElement('details');
        det.className = 'item';
        if(state.recAbierto === i) det.open = true;
        det.addEventListener('toggle', function(){ state.recAbierto = det.open ? i : null });
        det.innerHTML = '<summary><span class="nm">'+esc(it.titulo)+
          '<small>'+esc([it.fuente, it.duracion].filter(Boolean).join(' · '))+'</small></span>'+
          '<button class="state" data-s="'+esc(it.estado||'pendiente')+'">'+esc(it.estado||'pendiente')+'</button>'+
          '</summary><div class="box"></div>';
        det.querySelector('.state').addEventListener('click', function(ev){
          ev.preventDefault(); ev.stopPropagation();
          var order = ['pendiente','escuchando','hecho'];
          var nx = clone(rec);
          nx.items[i].estado = order[(order.indexOf(it.estado || 'pendiente') + 1) % 3];
          save('recomendados', nx); render();
        });
        var box = det.querySelector('.box');
        if(it.porque) box.appendChild(h('<p class="porque">'+esc(it.porque)+'</p>').firstChild);
        var ta = document.createElement('textarea');
        ta.id = 'rec-com-' + i;
        ta.placeholder = 'Qué te has llevado: ideas, datos, qué aplicar…';
        ta.value = it.comentario || '';
        ta.addEventListener('change', function(){
          var nx = clone(rec); nx.items[i].comentario = ta.value; save('recomendados', nx);
        });
        box.appendChild(ta);
        cr.body.appendChild(det);
      });
    } else {
      cr.body.innerHTML = '<div class="muted small">Esta semana no hay recomendaciones cargadas. Llegan con la agenda del domingo.</div>';
    }
    s.appendChild(cr);

    var lib = store.estudio || {items:[]};
    var c = card('Biblioteca', (lib.items||[]).filter(function(i){ return i.estado !== 'hecho' }).length + ' pendientes');
    if((lib.items||[]).length){
      (lib.items||[]).forEach(function(it, i){
        var det = document.createElement('details');
        det.className = 'item';
        if(state.libAbierto === i) det.open = true;
        det.addEventListener('toggle', function(){ state.libAbierto = det.open ? i : null });
        det.innerHTML = '<summary><span class="nm">'+esc(it.titulo)+
          '<small>'+esc([it.tipo, it.fuente, it.duracion].filter(Boolean).join(' · '))+'</small></span>'+
          '<button class="state" data-s="'+esc(it.estado||'pendiente')+'">'+esc(it.estado||'pendiente')+'</button>'+
          '</summary><div class="box"></div>';
        det.querySelector('.state').addEventListener('click', function(ev){
          ev.preventDefault(); ev.stopPropagation();
          var order = ['pendiente','escuchando','hecho'];
          var nx = clone(lib);
          nx.items[i].estado = order[(order.indexOf(it.estado || 'pendiente') + 1) % 3];
          saveEstudio(nx); render();
        });
        var box = det.querySelector('.box');
        var ta2 = document.createElement('textarea');
        ta2.id = 'lib-com-' + i;
        ta2.placeholder = 'Comentarios: qué te ha parecido, qué aplicar…';
        ta2.value = it.comentario || '';
        ta2.addEventListener('change', function(){
          var nx = clone(lib); nx.items[i].comentario = ta2.value; saveEstudio(nx);
        });
        box.appendChild(ta2);
        var acts = document.createElement('div'); acts.className = 'acts';
        var del = document.createElement('button');
        del.className = 'btn danger'; del.textContent = 'Borrar';
        del.addEventListener('click', function(){
          var nx = clone(lib); nx.items.splice(i,1); saveEstudio(nx); render();
        });
        acts.appendChild(del); box.appendChild(acts);
        c.body.appendChild(det);
      });
    } else {
      c.body.innerHTML = '<div class="muted small">La biblioteca está vacía. Añade lo primero que quieras escuchar en el coche.</div>';
    }
    var row = document.createElement('div'); row.className = 'addrow';
    var inp = document.createElement('input');
    inp.id = 'newstudy'; inp.placeholder = 'Añadir: podcast, clase o libro'; inp.setAttribute('aria-label','Nuevo contenido');
    var add = document.createElement('button'); add.className = 'btn primary'; add.textContent = 'Añadir';
    function addItem(){
      var t = inp.value.trim(); if(!t) return;
      var nx = clone(store.estudio || {items:[]});
      nx.items = nx.items || [];
      nx.items.unshift({titulo:t, tipo:'', fuente:'', duracion:'', estado:'pendiente', comentario:''});
      inp.value = '';
      saveEstudio(nx); render();
    }
    add.addEventListener('click', addItem);
    inp.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); addItem() } });
    row.appendChild(inp); row.appendChild(add);
    c.body.appendChild(row);
    s.appendChild(c);
    return s;
  }

  /* ============ DATOS: exportar / importar ============ */
  function countWeeks(){ return Object.keys(store.semanas || {}).length }
  function storeBytes(){ try{ return new Blob([JSON.stringify(store)]).size }catch(e){ return 0 } }

  function viewDatos(){
    var s = stack();
    var c = card('Tus datos', 'solo en este dispositivo');
    c.body.innerHTML =
      '<p class="small muted" style="margin:0 0 10px">Todo lo que ves en la app se guarda en el almacenamiento de este navegador. No sale a ningún servidor, así que nadie que abra la dirección web ve tus datos. El precio: si borras los datos del navegador o cambias de móvil, se pierden. Exporta de vez en cuando.</p>';
    var kv = document.createElement('ul'); kv.className='kv';
    kv.innerHTML =
      '<li><span>Semanas guardadas</span><span class="v">'+countWeeks()+'</span></li>'+
      '<li><span>Contenidos de estudio</span><span class="v">'+((store.estudio && store.estudio.items) || []).length+'</span></li>'+
      '<li><span>Mediciones</span><span class="v">'+medidas().length+'</span></li>'+
      '<li><span>Marchas en el repertorio</span><span class="v">'+marchas().length+'</span></li>'+
      '<li><span>Entregas de la FP</span><span class="v">'+fp().entregas.length+'</span></li>'+
      '<li><span>Tamaño</span><span class="v">'+(storeBytes()/1024).toFixed(1)+' KB</span></li>'+
      '<li><span>Último guardado</span><span class="v">'+(store.meta && store.meta.guardado ? new Date(store.meta.guardado).toLocaleString('es-ES') : '—')+'</span></li>'+
      '<li><span>Almacenamiento</span><span class="v">'+(storageOk ? 'disponible' : 'bloqueado')+'</span></li>';
    c.body.appendChild(kv);

  function exportar(){
    try{
      var data = JSON.stringify(store, null, 2);
      var blob = new Blob([data], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'agenda-personal-' + iso(new Date()) + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url) }, 4000);
      toast('Copia exportada');
    }catch(e){ toast('No se pudo exportar en este navegador') }
  }

  var importMode = 'merge';
  function pickFile(mode){
    importMode = mode;
    var f = document.getElementById('importfile');
    f.value = '';
    f.click();
  }
  document.getElementById('importfile').addEventListener('change', function(ev){
    var file = ev.target.files && ev.target.files[0];
    if(!file) return;
    var r = new FileReader();
    r.onload = function(){
      var inc;
      try{ inc = JSON.parse(String(r.result)) }
      catch(e){ toast('Ese archivo no es una copia válida'); return }
      if(!inc || typeof inc !== 'object' || (!inc.semanas && !inc.estudio && !inc.fp)){
        toast('Ese archivo no parece una copia de tu agenda'); return;
      }
      if(importMode === 'replace'){
        if(!window.confirm('Se reemplaza todo lo de este dispositivo por el contenido del archivo. ¿Seguir?')) return;
        store = {
          meta: inc.meta || {app:'semana-serrana', version:1},
          semanas: inc.semanas || {},
          estudio: inc.estudio || {items:[]},
          medidas: inc.medidas || {registros:[]},
          repertorio: inc.repertorio || {marchas:[]},
          fp: inc.fp || {clases:[], entregas:[], modulos:[]},
          config: inc.config || {}
        };
        persist();
        toast('Copia restaurada: ' + Object.keys(store.semanas).length + ' semanas');
      } else {
        var nw = 0;
        Object.keys(inc.semanas || {}).forEach(function(k){
          var mine = store.semanas[k] || {};
          var theirs = inc.semanas[k] || {};
          Object.keys(theirs).forEach(function(mod){ mine[mod] = theirs[mod] });
          store.semanas[k] = mine; nw++;
        });
        var items = (store.estudio && store.estudio.items) || [];
        var have = {};
        items.forEach(function(i){ have[(i.titulo||'').toLowerCase()] = true });
        ((inc.estudio && inc.estudio.items) || []).forEach(function(i){
          if(!have[(i.titulo||'').toLowerCase()]) items.unshift(i);
        });
        store.estudio = {items:items};

        // medidas: se combinan por fecha, gana la del archivo
        var regs = medidas().slice();
        ((inc.medidas && inc.medidas.registros) || []).forEach(function(r){
          regs = regs.filter(function(x){ return x.fecha !== r.fecha });
          regs.push(r);
        });
        regs.sort(function(a,b){ return a.fecha < b.fecha ? -1 : 1 });
        store.medidas = {registros:regs};

        // repertorio: se añaden las marchas que falten, sin tocar tus comentarios
        var mar = marchas().slice();
        var tengo = {};
        mar.forEach(function(m){ tengo[(m.titulo||'').toLowerCase()] = true });
        ((inc.repertorio && inc.repertorio.marchas) || []).forEach(function(m){
          if(!tengo[(m.titulo||'').toLowerCase()]) mar.push(m);
        });
        store.repertorio = {marchas:mar};

        // FP: entregas por id (gana el archivo), clases y módulos sin duplicar
        if(inc.fp){
          var x = fp();
          (inc.fp.entregas || []).forEach(function(e){
            if(!e.id) e.id = uid();
            var mia = x.entregas.filter(function(y){ return y.id === e.id })[0];
            if(mia){ Object.keys(e).forEach(function(k){ if(k !== 'estado') mia[k] = e[k] }) }
            else x.entregas.push(e);
          });
          if(inc.fp.nombre) x.nombre = inc.fp.nombre;
          (inc.fp.clases || []).forEach(function(c){
            var rep = x.clases.some(function(y){
              return Number(y.dia) === Number(c.dia) && y.ini === c.ini && y.fin === c.fin;
            });
            if(!rep) x.clases.push(c);
          });
          (inc.fp.modulos || []).forEach(function(m){
            var nom = nombreModulo(m);
            var i = -1;
            x.modulos.forEach(function(y, j){ if(nombreModulo(y) === nom) i = j });
            if(i < 0) x.modulos.push(m); else x.modulos[i] = m;
          });
          store.fp = x;
        }
        if(inc.config) Object.keys(inc.config).forEach(function(k){ store.config[k] = inc.config[k] });
        persist();
        toast('Importado: ' + nw + ' semana' + (nw===1?'':'s'));
      }
      render();
    };
    r.onerror = function(){ toast('No se pudo leer el archivo') };
    r.readAsText(file);
  });

  /* ============ APUNTE RÁPIDO ============
     Una sola caja: escribes "dentista jueves 17:30", "comprar café y leche" o
     "entrega práctica 3 el 20 nov" y la app entiende qué es, cuándo y dónde va.
     Todo se interpreta en el propio dispositivo: sin servidor y sin conexión. */
  var DIAS_N = ['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
  var MESES_N = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var MESES_A = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function sinTildes(x){ return x.normalize ? x.normalize('NFD').replace(/[̀-ͯ]/g, '') : x }

  function adivinaModulo(txt){
    var stop = {sistemas:1, introduccion:1, personal:1, profesional:1};
    var mejor = '', puntos = 0;
    nombresModulos().forEach(function(n){
      var p = 0;
      sinTildes(n.toLowerCase()).split(/[^a-z]+/).forEach(function(w){
        if(w.length < 5 || stop[w]) return;
        var raiz = w.slice(0, Math.max(5, w.length - 2));
        if(txt.indexOf(raiz) >= 0) p++;
      });
      if(p > puntos){ puntos = p; mejor = n }
    });
    return mejor;
  }

  function interpreta(texto, forzado){
    var raw = String(texto || '').replace(/\s+/g, ' ').trim();
    if(!raw) return null;
    var low = sinTildes(raw.toLowerCase());
    if(low.length !== raw.length) raw = low;
    var low0 = low;
    var chars = raw.split('');
    function quita(re){
      var m = re.exec(low);
      if(!m) return null;
      var a = m.index, b = a + m[0].length, hueco = '';
      for(var i = a; i < b; i++){ chars[i] = ' '; hueco += ' ' }
      low = low.slice(0, a) + hueco + low.slice(b);
      return m;
    }
    var m;

    /* --- qué es --- */
    var visto = 'evento', subtipo = 'entrega';
    if(/^(?:comprar|compra|falta|faltan)\b/.test(low)) visto = 'compra';
    else if(/\b(?:examen|parcial)\b/.test(low)){ visto = 'entrega'; subtipo = 'examen' }
    else if(/\b(?:entregar|entrega|tarea)\b/.test(low)) visto = 'entrega';
    else if(/^(?:escuchar|podcast|leer)\b/.test(low)) visto = 'estudio';
    var r = {tipo: forzado || visto, auto: visto};
    if(r.tipo === 'compra') quita(/^(?:comprar|compra|faltan|falta)\b:?/);
    if(r.tipo === 'entrega' && subtipo !== 'examen') quita(/^(?:entregar|entrega de la|entrega del|entrega de|entrega)\b:?/);
    if(r.tipo === 'estudio') quita(/^(?:escuchar|podcast|leer)\b:?/);

    /* --- cuándo --- */
    var tarde = !!quita(/\b(?:de|por) la (?:tarde|noche)\b/);
    var deManana = !!quita(/\b(?:de|por) la manana\b/);
    var hoy = fechaDe(iso(new Date())), f = null;
    if(quita(/\bpasado manana\b/)) f = addDays(hoy, 2);
    else if(quita(/\bmanana\b/)) f = addDays(hoy, 1);
    else if(quita(/\bhoy\b/)) f = hoy;

    var ini = null, fin = null;
    function hm(h, mi){ return {h:+h, m: mi ? +mi : 0} }
    if((m = quita(/\bde (?:las? )?(\d{1,2})(?:[:.h](\d{2}))?h? a (?:las? )?(\d{1,2})(?:[:.h](\d{2}))?h?\b/))){
      ini = hm(m[1], m[2]); fin = hm(m[3], m[4]);
    } else if((m = quita(/\b(?:a|sobre|desde) las? (\d{1,2})(?:[:.h](\d{2}))?h?\b/))){
      ini = hm(m[1], m[2]);
    } else if((m = quita(/\b(\d{1,2})[:.](\d{2})h?\b/))){
      ini = hm(m[1], m[2]);
    } else if((m = quita(/\b(\d{1,2}) ?h\b/))){
      ini = hm(m[1]);
    }
    var durMin = 60;
    if((m = quita(/\bdurante (\d{1,3}) ?(horas?|h|min(?:utos)?)\b/))) durMin = /^h/.test(m[2]) ? (+m[1]) * 60 : +m[1];

    if(!f && (m = /\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/.exec(low)) && +m[2] >= 1 && +m[2] <= 12 && +m[1] >= 1 && +m[1] <= 31){
      quita(/\b(?:el )?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
      var y = m[3] ? (+m[3] < 100 ? 2000 + (+m[3]) : +m[3]) : hoy.getFullYear();
      f = new Date(y, +m[2] - 1, +m[1]);
      if(!m[3] && f < hoy) f = new Date(y + 1, +m[2] - 1, +m[1]);
    }
    if(!f && (m = quita(new RegExp('\\b(?:el dia |el |dia )?(\\d{1,2}) (?:de )?(' + MESES_N.join('|') + '|ene|feb|mar|abr|may|jun|jul|ago|sept|sep|oct|nov|dic)\\b\\.?(?: (?:de |del )?(\\d{4}))?')))){
      var mi = MESES_A.indexOf(m[2].slice(0, 3));
      var y2 = m[3] ? +m[3] : hoy.getFullYear();
      f = new Date(y2, mi, +m[1]);
      if(!m[3] && f < hoy) f = new Date(y2 + 1, mi, +m[1]);
    }
    if(!f && (m = quita(new RegExp('\\b(?:(el proximo|proximo|este|el) )?(' + DIAS_N.join('|') + ')\\b')))){
      var salto = (DIAS_N.indexOf(m[2]) - ((hoy.getDay() + 6) % 7) + 7) % 7;
      if(salto === 0 && /proximo/.test(m[1] || '')) salto = 7;
      f = addDays(hoy, salto);
    }
    if(!f && (m = quita(/\b(?:el dia|el|dia) (\d{1,2})\b(?![:.\dh\/])/)) && +m[1] >= 1 && +m[1] <= 31){
      f = new Date(hoy.getFullYear(), hoy.getMonth(), +m[1]);
      if(f < hoy) f = new Date(hoy.getFullYear(), hoy.getMonth() + 1, +m[1]);
    }

    function ajusta(t){
      if(!t) return null;
      if(tarde && t.h < 12) t.h += 12;
      else if(!deManana && !tarde && t.h >= 1 && t.h <= 6) t.h += 12;
      return (t.h > 23 || t.m > 59) ? null : t;
    }
    ini = ajusta(ini); fin = ajusta(fin);
    if(ini && fin && (fin.h * 60 + fin.m) <= (ini.h * 60 + ini.m) && fin.h < 12) fin.h += 12;
    function txt(t){ return pad(t.h) + ':' + pad(t.m) }
    if(ini && !fin){
      var tot = Math.min(ini.h * 60 + ini.m + durMin, 23 * 60 + 59);
      fin = {h: Math.floor(tot / 60), m: tot % 60};
    }

    /* --- el título, con lo que no era fecha ni hora --- */
    var titulo = chars.join('').replace(/\s+/g, ' ').trim();
    for(var k = 0; k < 2; k++){
      titulo = titulo.replace(/^(?:de|del|a|al|en|para|y)\s+/i, '').replace(/\s+(?:el|la|los|las|de|del|a|al|en|para|con|y)$/i, '');
    }
    titulo = titulo.replace(/^[\s,;:.\-]+|[\s,;:.\-]+$/g, '');
    if(titulo) titulo = titulo.charAt(0).toUpperCase() + titulo.slice(1);
    r.titulo = titulo;
    r.fecha = f ? iso(f) : null;
    r.ini = ini ? txt(ini) : null;
    r.fin = fin ? txt(fin) : null;

    if(r.tipo === 'evento'){
      var CLAVES = [
        ['ensayo', /\bensayo\b/],
        ['entreno', /\b(?:entreno|entrenar|gimnasio|gym|correr|pesas|hyrox|crossfit|natacion)\b/],
        ['estudio', /\b(?:clase|estudiar|estudio|repaso|tutoria)\b/],
        ['trabajo', /\b(?:trabajo|turno|reunion|guardia)\b/],
        ['comida', /\b(?:comida|cena|almuerzo|desayuno|merienda|comer|cenar)\b/],
        ['trayecto', /\b(?:viaje|trayecto)\b/]
      ];
      r.cat = 'casa';
      CLAVES.some(function(c){ if(c[1].test(low0)){ r.cat = c[0]; return true } return false });
      r.sinHora = !r.ini;
      if(!r.fecha) r.fecha = iso(hoy);
      if(!r.ini){ r.ini = '09:00'; r.fin = '10:00' }
      if(!r.titulo) r.titulo = CATS[r.cat].n;
    }
    if(r.tipo === 'compra'){
      r.items = r.titulo.split(/\s*,\s*|\s+y\s+/).map(function(x){ return x.trim() }).filter(Boolean).map(function(x){
        var q = x.match(/\s(\d[\d.,]*\s*(?:kg|g|l|ml|uds?|unidades?|paquetes?|latas?|botes?|bolsas?))$/i);
        var n = q ? x.slice(0, q.index).trim() : x;
        return {n: n.charAt(0).toUpperCase() + n.slice(1), cant: q ? q[1] : ''};
      });
    }
    if(r.tipo === 'entrega'){
      r.subtipo = subtipo;
      r.modulo = adivinaModulo(low0);
      r.sinFecha = !r.fecha;
      if(!r.fecha) r.fecha = iso(addDays(hoy, 7));
      if(!r.titulo) r.titulo = subtipo === 'examen' ? 'Examen' : 'Entrega';
    }
    return r;
  }

  function fechaLarga(f){
    var dd = diasHasta(f), dt = fechaDe(f);
    var base = DAYNAMES[(dt.getDay() + 6) % 7] + ' ' + dt.getDate() + ' ' + MONTHS[dt.getMonth()].slice(0, 3);
    return dd === 0 ? 'hoy, ' + base : (dd === 1 ? 'mañana, ' + base : base);
  }

  /* lo que se enseña antes de guardar: {donde, linea1, linea2, valido} */
  function lectura(r){
    if(!r) return null;
    if(r.tipo === 'evento'){
      return {sec:'agenda', l1:r.titulo, valido:true,
              l2:'Agenda · ' + fechaLarga(r.fecha) + ' · ' + (r.sinHora ? 'sin hora, te lo dejo a las 09:00' : r.ini + '–' + r.fin) + ' · ' + CATS[r.cat].n};
    }
    if(r.tipo === 'compra'){
      var n = (r.items || []).length;
      return {sec:'comida', valido:n > 0,
              l1: n ? r.items.map(function(i){ return i.n + (i.cant ? ' (' + i.cant + ')' : '') }).join(', ') : '¿Qué hay que comprar?',
              l2:'Lista de la compra · ' + (n === 1 ? '1 producto' : n + ' productos')};
    }
    if(r.tipo === 'entrega'){
      return {sec:'estudio', l1:r.titulo, valido:true,
              l2:(r.subtipo === 'examen' ? 'Examen' : 'Entrega') + ' · ' + fechaLarga(r.fecha) +
                 (r.sinFecha ? ' (sin fecha: te la pongo a una semana)' : '') + (r.modulo ? ' · ' + r.modulo : '')};
    }
    return {sec:'estudio', l1:r.titulo || '¿Qué quieres escuchar?', valido:!!r.titulo, l2:'Biblioteca · pendiente de escuchar'};
  }

  function guardaApunte(r){
    if(r.tipo === 'evento'){
      guardaEvento(r.fecha, null, {fecha:r.fecha, ini:r.ini, fin:r.fin, cat:r.cat, titulo:r.titulo, nota:''});
    } else if(r.tipo === 'compra'){
      var wk = widDe(iso(new Date()));
      if(!store.semanas[wk]) store.semanas[wk] = {};
      var mn = store.semanas[wk].menu || {dias:[], compra:{secciones:[], presupuesto:[60,80]}};
      if(!mn.compra) mn.compra = {secciones:[], presupuesto:[60,80]};
      if(!mn.compra.secciones) mn.compra.secciones = [];
      var sec = mn.compra.secciones.filter(function(x){ return x.nombre === EXTRAS })[0];
      if(!sec){ sec = {nombre:EXTRAS, items:[]}; mn.compra.secciones.push(sec) }
      r.items.forEach(function(i){ sec.items.push({n:i.n, cant:i.cant, ok:false}) });
      store.semanas[wk].menu = mn;
      persist();
    } else if(r.tipo === 'entrega'){
      var x = clone(fp());
      x.entregas.push({id:uid(), titulo:r.titulo, fecha:r.fecha, tipo:r.subtipo === 'examen' ? 'examen' : 'entrega',
                       modulo:r.modulo || '', estado:'pendiente'});
      saveFp(x);
    } else {
      var lib = clone(store.estudio || {items:[]});
      lib.items = lib.items || [];
      lib.items.unshift({titulo:r.titulo, tipo:'', fuente:'', duracion:'', estado:'pendiente', comentario:''});
      saveEstudio(lib);
    }
  }

  var cap = {forzado:null};
  var TIPOS_CAP = [[null,'Automático'],['evento','Evento'],['compra','Compra'],['entrega','Entrega'],['estudio','Para escuchar']];
  function pintaCaptura(){
    var inp = document.getElementById('cap');
    var r = interpreta(inp.value, cap.forzado);
    var L = lectura(r);
    var caja = document.getElementById('cap-lec');

      caja.className = 'lectura vacia';
      caja.textContent = 'Escribe y te digo dónde lo guardo.';

      caja.className = 'lectura';
      caja.innerHTML = '<span class="tile" style="--t:'+sx.c+'">'+icono(sx.k)+'</span>'+
        '<span class="lt"><b>'+esc(L.l1)+'</b><small>'+esc(L.l2)+'</small></span>';
    }
    var tipos = document.getElementById('cap-tipos');
    tipos.innerHTML = '';
    TIPOS_CAP.forEach(function(t){
      var b = document.createElement('button');
      b.className = 'pill'; b.type = 'button';
      b.textContent = t[1] + (t[0] === null && r && !cap.forzado ? ': ' + ({evento:'evento', compra:'compra', entrega:'entrega', estudio:'audio'})[r.auto] : '');
      b.setAttribute('aria-pressed', cap.forzado === t[0] ? 'true' : 'false');
      b.addEventListener('click', function(){ cap.forzado = t[0]; pintaCaptura(); inp.focus() });
      tipos.appendChild(b);
    });
    document.getElementById('cap-ok').disabled = !(L && L.valido);
    return {r:r, L:L};
  }

  });

  /* ---------- tema claro / oscuro ---------- */
  var LUNA = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>';
  var SOL = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10l1.4 1.4m0-12.8l-1.4 1.4m-10 10l-1.4 1.4"/></svg>';
  var themeBtn = document.getElementById('themebtn');
  function pintaTema(t){
    document.documentElement.setAttribute('data-theme', t);
    themeBtn.innerHTML = t === 'dark' ? SOL : LUNA;
    themeBtn.title = t === 'dark' ? 'Pasar a claro' : 'Pasar a oscuro';
  }
  function temaGuardado(){
    try{ return localStorage.getItem('semana-serrana.tema') || 'light' }catch(e){ return 'light' }
  }
  pintaTema(temaGuardado());
  themeBtn.addEventListener('click', function(){
    var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    try{ localStorage.setItem('semana-serrana.tema', t) }catch(e){}
    pintaTema(t);
  });

  /* ---------- desplegable, apunte rápido y teclado ---------- */
  document.getElementById('secbtn').addEventListener('click', function(){
    if(document.getElementById('menu').hidden) abreMenu(); else cierraMenu();
  });
  document.getElementById('scrim').addEventListener('click', function(){ cierraMenu(); cierraCaptura() });
  document.getElementById('fab').addEventListener('click', abreCaptura);
  document.getElementById('sheet-x').addEventListener('click', cierraCaptura);
  document.getElementById('cap').addEventListener('input', pintaCaptura);
  document.getElementById('cap').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); confirmaCaptura() }
  });
  document.getElementById('cap-ok').addEventListener('click', confirmaCaptura);
  if(window.visualViewport){
    var recoloca = function(){
      var vv = window.visualViewport;
      var hueco = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      document.getElementById('sheet').style.bottom = hueco + 'px';
    };
    window.visualViewport.addEventListener('resize', recoloca);
    window.visualViewport.addEventListener('scroll', recoloca);
  }
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ cierraMenu(); cierraCaptura() }
  });

  loadStore();
  render();
  if(!storageOk) toast('Este navegador no deja guardar datos: lo que toques no se conservará');

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').then(function(reg){
        reg.update();
        setInterval(function(){ reg.update() }, 60 * 60 * 1000);
      }).catch(function(){});
      var recargando = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(recargando) return;
        recargando = true;
        location.reload();
      });
    });
  }
})();
</script>
</body>
</html>
