<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Agenda personal</title>
<meta name="description" content="Agenda, entreno y medidas, menú y compra, banda y estudio. Los datos se guardan solo en este dispositivo.">
<meta name="theme-color" content="#F2F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1513" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>
/* El tema se fija antes de pintar, para que no parpadee. Claro por defecto. */
(function(){
  var t = 'light';
  try{ t = localStorage.getItem('semana-serrana.tema') || 'light' }catch(e){}
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
:root{
  --bg:#F7F9F6; --surface:#FFFFFF; --surface2:#ECF0EC; --line:#DCE2DD;
  --ink:#141A18; --ink2:#5B6663; --ink3:#8A9591;
  --accent:#1F6B5E; --accent-ink:#FFFFFF; --accent-soft:#DCEAE5;
  --c-trabajo:#3C6491; --c-trayecto:#A9762C; --c-ensayo:#7E5490;
  --c-entreno:#B3453C; --c-estudio:#1F6B5E; --c-comida:#6E8C2E; --c-casa:#6B7370;
  --ok:#2E7D5B; --warn:#A9762C; --crit:#B3453C; --c-hoy:#B97A2B; --c-fp:#6E5B9E;
  --shadow:0 1px 2px rgba(20,26,24,.05), 0 10px 30px -12px rgba(20,40,34,.28);
  --r:18px;
  --sec:#1F6B5E; --on-sec:#FFFFFF;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A211F; --surface:#232B29; --surface2:#2C3634; --line:#3A4543;
    --ink:#EAF0ED; --ink2:#A8B4B0; --ink3:#828E8A;
    --accent:#4FB09C; --accent-ink:#08211C; --accent-soft:#17322C;
    --c-trabajo:#7FA6D4; --c-trayecto:#D7A55C; --c-ensayo:#B58CC6;
    --c-entreno:#E0786D; --c-estudio:#4FB09C; --c-comida:#A3C25E; --c-casa:#97A29E;
    --ok:#5BBF93; --warn:#D7A55C; --crit:#E0786D; --on-sec:#0E1412; --c-hoy:#E2AD62; --c-fp:#AC9ADB;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A211F; --surface:#232B29; --surface2:#2C3634; --line:#3A4543;
  --ink:#EAF0ED; --ink2:#A8B4B0; --ink3:#828E8A;
  --accent:#4FB09C; --accent-ink:#08211C; --accent-soft:#17322C;
  --c-trabajo:#7FA6D4; --c-trayecto:#D7A55C; --c-ensayo:#B58CC6;
  --c-entreno:#E0786D; --c-estudio:#4FB09C; --c-comida:#A3C25E; --c-casa:#97A29E;
  --ok:#5BBF93; --warn:#D7A55C; --crit:#E0786D; --on-sec:#0E1412; --c-hoy:#E2AD62; --c-fp:#AC9ADB;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
  touch-action:manipulation;   /* nada de zoom al tocar dos veces */
}
input,textarea,select,button{touch-action:manipulation}
img{max-width:100%}
h1,h2,h3{font-family:var(--display); font-weight:700; margin:0; text-wrap:balance; letter-spacing:-.01em}
button{font:inherit; color:inherit}
input,textarea,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
[hidden]{display:none !important}

/* ---------- color por sección ---------- */
:root[data-sec="hoy"]{--sec:var(--c-hoy)}
:root[data-sec="agenda"]{--sec:var(--c-trabajo)}
:root[data-sec="entreno"]{--sec:var(--c-entreno)}
:root[data-sec="comida"]{--sec:var(--c-comida)}
:root[data-sec="banda"]{--sec:var(--c-ensayo)}
:root[data-sec="estudio"]{--sec:var(--c-fp)}
:root[data-sec="datos"]{--sec:var(--accent)}

.shell{max-width:880px; margin:0 auto; padding-inline:16px; padding-block:0 108px}
header.top{
  position:sticky; top:0; z-index:20; background:var(--bg);
  padding-block:12px 10px; border-bottom:1px solid var(--line);
  margin-inline:-16px; padding-inline:16px;
}
@supports (color: color-mix(in srgb, red, blue)){
  header.top{background:linear-gradient(180deg, color-mix(in srgb, var(--sec) 13%, var(--bg)) 0%, var(--bg) 100%)}
}
.bar{display:flex; align-items:center; gap:8px}
.bar .sp{flex:1}
.secbtn{
  display:flex; align-items:center; gap:10px; min-width:0; cursor:pointer;
  background:none; border:0; padding:2px 6px 2px 0; border-radius:14px; text-align:left;
}
.secbtn .tx{display:flex; flex-direction:column; min-width:0; line-height:1.1}
.secbtn .tx small{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink3)}
.secbtn .tx b{font-family:var(--display); font-weight:700; font-size:23px; letter-spacing:-.015em; white-space:nowrap}
.secbtn .chev{width:18px; height:18px; flex:0 0 auto; color:var(--ink2); transition:transform .18s ease; margin-top:10px}
.secbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.tile{
  width:40px; height:40px; flex:0 0 auto; border-radius:13px; display:grid; place-items:center;
  background:var(--surface2); color:var(--t, var(--sec));
}
@supports (color: color-mix(in srgb, red, blue)){
  .tile{background:color-mix(in srgb, var(--t, var(--sec)) 17%, var(--surface))}
}
.tile svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

.weekbar{display:flex; align-items:center; gap:8px; margin-top:10px}
.weekbar .label{flex:1; min-width:0; font-size:13.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.weekbar .label small{color:var(--ink3); font-weight:400; font-size:12px; margin-left:6px}
.iconbtn{
  display:grid; place-items:center; width:34px; height:34px; flex:0 0 auto;
  background:var(--surface); border:1px solid var(--line); border-radius:11px; cursor:pointer;
}
.iconbtn:hover{border-color:var(--sec)}
.pill{
  border:1px solid var(--line); background:var(--surface); border-radius:999px;
  padding:7px 14px; font-size:13px; cursor:pointer; white-space:nowrap;
}
.pill[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}

/* ---------- desplegable de secciones ---------- */
.menu{
  position:absolute; left:8px; right:8px; top:calc(100% - 4px); z-index:25;
  max-width:440px; max-height:min(74vh, 620px); overflow-y:auto;
  background:var(--surface); border:1px solid var(--line); border-radius:20px;
  box-shadow:0 24px 60px -18px rgba(12,22,18,.45), 0 2px 6px rgba(12,22,18,.08);
  padding:8px; animation:baja .16s ease;
}
@keyframes baja{ from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none} }
.mrow{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer;
  background:none; border:0; border-radius:14px; padding:9px 10px;
}
.mrow:hover,.mrow[aria-current="true"]{background:var(--surface2)}
.mrow .mt{flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.25}
.mrow .mt b{font-family:var(--display); font-weight:700; font-size:16px}
.mrow .mt small{font-size:12px; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mrow .aqui{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--t)}
.msub{display:flex; flex-wrap:wrap; gap:6px; padding:0 10px 8px 62px}
.mchip{
  border:1px solid var(--line); background:var(--surface); border-radius:999px;
  padding:5px 11px; font-size:12px; cursor:pointer; color:var(--ink2);
}
.mchip:hover{border-color:var(--t); color:var(--ink)}
.mchip[aria-current="true"]{background:var(--t); border-color:var(--t); color:var(--on-sec)}
.msep{height:1px; background:var(--line); margin:6px 10px}
.scrim{position:fixed; inset:0; z-index:15; background:rgba(12,18,16,.38)}
.scrim[data-for="sheet"]{z-index:55}

/* ---------- apunte rápido ---------- */
.fab{
  position:fixed; right:max(18px, env(safe-area-inset-right)); bottom:calc(20px + env(safe-area-inset-bottom)); z-index:40;
  width:58px; height:58px; border-radius:20px; border:0; cursor:pointer;
  background:var(--sec); color:var(--on-sec);
  box-shadow:0 14px 30px -10px rgba(12,22,18,.55), 0 2px 5px rgba(12,22,18,.2);
  display:grid; place-items:center;
}
.fab svg{width:26px; height:26px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round}
.fab:active{transform:scale(.96)}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:60; margin:0 auto; max-width:560px;
  background:var(--surface); border:1px solid var(--line); border-bottom:0;
  border-radius:24px 24px 0 0; padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -22px 60px -20px rgba(12,22,18,.5); animation:sube .2s ease;
}
@keyframes sube{ from{transform:translateY(24px); opacity:0} to{transform:none; opacity:1} }
.sheet h2{font-size:18px}
.sheet .cab{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.sheet .cab .sp{flex:1}
.sheet input.cap{
  width:100%; font-size:16px; padding:13px 14px; border-radius:14px;
  background:var(--surface2); border:1.5px solid var(--line); min-width:0;
}
.sheet input.cap:focus{outline:none; border-color:var(--sec)}
.lectura{
  margin-top:10px; padding:11px 13px; border-radius:14px; background:var(--surface2);
  display:flex; gap:11px; align-items:center; min-height:62px;
}
.lectura .lt{flex:1; min-width:0; line-height:1.3}
.lectura .lt b{display:block; font-size:14.5px; overflow-wrap:anywhere}
.lectura .lt small{display:block; font-size:12px; color:var(--ink2)}
.lectura.vacia{color:var(--ink3); font-size:13px}
.tipos{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.ejemplos{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.ejemplos button{
  border:1px dashed var(--line); background:none; border-radius:999px; padding:5px 10px;
  font-size:12px; color:var(--ink2); cursor:pointer;
}
.hecho-ok{font-size:12.5px; color:var(--ok); margin-top:8px; min-height:18px}

/* ---------- anillo del día ---------- */
.banner .ring{position:absolute; z-index:1; top:14px; right:14px; width:62px; height:62px}
.banner .ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.banner .ring .tr{fill:rgba(10,16,14,.28); stroke:rgba(255,255,255,.3); stroke-width:5}
.banner .ring .pr{fill:none; stroke:#fff; stroke-width:5; stroke-linecap:round}
.banner .ring span{
  position:absolute; inset:0; display:grid; place-items:center; color:#fff;
  font-family:var(--mono); font-size:13px; font-weight:500;
}

/* las pestañas internas van sueltas, sin tarjeta */
.card.sub{background:none; border:0; box-shadow:none}
.card.sub>.body{padding:0; overflow-x:auto; flex-wrap:nowrap; scrollbar-width:none}
.card.sub>.body::-webkit-scrollbar{display:none}

.stack{display:flex; flex-direction:column; gap:14px; margin-top:16px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card>.head{display:flex; align-items:center; gap:10px; padding:13px 15px 0}
.card>.head h2{font-size:15.5px; flex:1; min-width:0}
.card>.body{padding:12px 15px 15px}
.eyebrow{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink3)}
.card>.head .eyebrow{color:var(--sec); font-weight:500}
.muted{color:var(--ink2)}
.small{font-size:13.5px}
.empty{padding:18px 15px; color:var(--ink2); font-size:14px}
.note{
  border-left:3px solid var(--warn); background:var(--surface2);
  padding:10px 12px; border-radius:0 10px 10px 0; font-size:13.5px; color:var(--ink2);
}
/* ---------- banners con paisaje ---------- */
.banner{
  position:relative; border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow);
  min-height:132px; display:flex; align-items:flex-end;
  background:var(--surface2) center 62% / cover no-repeat;
}
.banner.tall{min-height:214px}
.banner::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(10,16,14,0) 34%, rgba(10,16,14,.26) 62%, rgba(10,16,14,.70) 100%);
}
.banner .inner{position:relative; z-index:1; padding:16px 16px 15px; width:100%; color:#F4F6F3}
.banner .eyebrow{color:rgba(244,246,243,.8)}
.banner h2{font-size:20px; color:#fff; text-shadow:0 2px 14px rgba(0,0,0,.4)}
.banner .day{
  font-family:var(--display); font-weight:700; font-size:31px; line-height:1.05;
  text-transform:capitalize; color:#fff; text-shadow:0 2px 16px rgba(0,0,0,.45);
}
.banner .date{color:rgba(244,246,243,.85); font-size:13px; margin-top:2px}
.banner .sub{font-size:13px; color:rgba(244,246,243,.85); margin-top:3px}
.banner .chip{border-color:rgba(255,255,255,.34); background:rgba(10,18,15,.34); color:rgba(255,255,255,.94)}
.banner .chip b{color:#fff}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:12px; border:1px solid var(--line); border-radius:999px; padding:4px 10px; color:var(--ink2)}
.chip b{font-family:var(--mono); font-weight:500; color:var(--ink)}
.dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto; box-shadow:0 0 0 2px rgba(255,255,255,.22)}

ul.blocks{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
ul.blocks li{display:flex; gap:11px; padding:9px 0; border-top:1px solid var(--line)}
ul.blocks li:first-child{border-top:0}
ul.blocks li.now{background:var(--surface2); margin-inline:-15px; padding-inline:15px; border-radius:10px; border-top-color:transparent}
ul.blocks li.done .title{text-decoration:line-through; color:var(--ink3)}
ul.blocks li.done .stripe{opacity:.35}
@supports (color: color-mix(in srgb, red, blue)){
  ul.blocks li.now{background:color-mix(in srgb, var(--sec) 13%, transparent)}
}
.time{font-family:var(--mono); font-size:12.5px; color:var(--ink2); width:44px; flex:0 0 auto; padding-top:1px}
.time span{display:block; color:var(--ink3)}
.stripe{width:4px; border-radius:3px; flex:0 0 auto; align-self:stretch}
.bmain{flex:1; min-width:0}
.bmain .title{font-weight:500; font-size:14.5px; overflow-wrap:anywhere}
.bmain .meta{font-size:12px; color:var(--ink3); margin-top:1px}
.tick{
  width:24px; height:24px; flex:0 0 auto; align-self:center; cursor:pointer;
  border:1px solid var(--line); border-radius:7px; background:var(--surface2);
  display:grid; place-items:center; padding:0;
}
.tick svg{width:14px; height:14px; stroke:var(--sec); fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; opacity:0}
.tick[aria-pressed="true"]{background:var(--surface2); border-color:var(--sec)}
@supports (color: color-mix(in srgb, red, blue)){
  .tick[aria-pressed="true"]{background:color-mix(in srgb, var(--sec) 18%, transparent)}
}
.tick[aria-pressed="true"] svg{opacity:1}
.del{
  width:24px; height:24px; flex:0 0 auto; align-self:center; cursor:pointer; padding:0;
  border:1px solid var(--line); border-radius:7px; background:var(--surface2); color:var(--crit);
  display:grid; place-items:center; font-size:14px; line-height:1;
}
.del:hover{border-color:var(--crit)}

.grid2{display:grid; gap:14px}
@media (min-width:760px){ .grid2{grid-template-columns:1fr 1fr} }

table.sets{width:100%; border-collapse:collapse; margin-top:6px}
table.sets th{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3); font-weight:500; text-align:left; padding:0 6px 4px 0}
table.sets td{padding:3px 6px 3px 0; border:0}
table.sets td:first-child{width:26px; color:var(--ink3); font-family:var(--mono); font-size:12px}
table.sets input{
  width:100%; min-width:0; text-align:center; padding:6px 2px;
  background:var(--surface2); border:1px solid var(--line); border-radius:8px;
  font-family:var(--mono); font-size:13.5px;
}
table.sets input:hover{border-color:var(--ink3)}
.ex{padding:11px 0; border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex h3{font-size:14px; font-weight:600; font-family:var(--body)}
.ex .obj{font-size:12px; color:var(--ink3); font-family:var(--mono)}
textarea.feel{
  width:100%; margin-top:10px; min-height:62px; resize:vertical;
  background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-size:13.5px;
}
.btn{border:1px solid var(--line); background:var(--surface2); border-radius:11px; padding:9px 13px; font-size:13.5px; cursor:pointer}
.btn:hover{border-color:var(--sec)}
.btn.primary{background:var(--sec); border-color:var(--sec); color:var(--on-sec); font-weight:500}
.btn.primary[aria-pressed="true"]{background:var(--surface2); color:var(--ink); border-color:var(--sec)}
.pill[aria-pressed="true"]{background:var(--sec); border-color:var(--sec); color:var(--on-sec); font-weight:500}
.btn.danger{color:var(--crit)}
.btn.danger:hover{border-color:var(--crit)}
.btnrow{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}

.meals{list-style:none; margin:0; padding:0}
.meals li{display:flex; gap:10px; padding:7px 0; border-top:1px solid var(--line); font-size:13.5px}
.meals li:first-child{border-top:0}
.meals .k{width:82px; flex:0 0 auto; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); padding-top:2px}
.shop{list-style:none; margin:0; padding:0}
.shop li{display:flex; align-items:center; gap:10px; padding:6px 0; border-top:1px solid var(--line); font-size:13.5px}
.shop li:first-child{border-top:0}
.shop li.on .n{text-decoration:line-through; color:var(--ink3)}
.shop .n{flex:1; min-width:0}
.shop .q{font-family:var(--mono); font-size:12px; color:var(--ink3)}
.meter{height:7px; border-radius:99px; background:var(--surface2); overflow:hidden; margin-top:8px}
.meter i{display:block; height:100%; background:var(--sec)}
.meter.over i{background:var(--crit)}

.items{list-style:none; margin:0; padding:0}
.items li{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line)}
.items li:first-child{border-top:0}
.items .t{flex:1; min-width:0; font-size:14px}
.items .t small{display:block; color:var(--ink3); font-size:11.5px; font-family:var(--mono)}
.state{border:1px solid var(--line); background:var(--surface2); border-radius:999px; padding:4px 10px; font-size:11.5px; cursor:pointer; white-space:nowrap}
.state[data-s="escuchando"]{border-color:var(--warn); color:var(--warn)}
.state[data-s="hecho"]{border-color:var(--ok); color:var(--ok)}
.addrow{display:flex; gap:8px; margin-top:12px}
.addrow input{flex:1; min-width:0; background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:13.5px}
.bars{display:flex; flex-direction:column; gap:7px; margin-top:4px}
.bar{display:flex; align-items:center; gap:9px; font-size:12.5px}
.bar .nm{width:74px; flex:0 0 auto; color:var(--ink2)}
.bar .tr{flex:1; height:9px; background:var(--surface2); border-radius:99px; overflow:hidden}
.bar .tr i{display:block; height:100%}
.bar .v{font-family:var(--mono); font-size:12px; color:var(--ink2); width:42px; text-align:right}
.hint{font-size:12.5px; color:var(--ink3); margin-top:10px}

form.newblock{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:10px}
form.newblock input,form.newblock select{
  background:var(--surface2); border:1px solid var(--line); border-radius:9px; padding:8px 9px; font-size:13.5px; min-width:0;
}
form.newblock .wide{grid-column:1/-1}
form.newblock label{display:flex; flex-direction:column; gap:4px; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); min-width:0}
form.newblock .acciones{grid-column:1/-1; display:flex; gap:8px; flex-wrap:wrap}
li.editor{display:block !important; padding:4px 0 12px}

/* ---------- vista de mes ---------- */
.mes{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
.mes .cab{
  font-size:10px; text-align:center; color:var(--ink3); text-transform:uppercase;
  letter-spacing:.06em; padding-bottom:2px;
}
.mes .dia{
  aspect-ratio:1/1.1; border:1px solid var(--line); border-radius:11px; background:var(--surface2);
  padding:5px 4px 4px; display:flex; flex-direction:column; align-items:center; gap:4px;
  cursor:pointer; min-width:0; font:inherit; color:inherit;
}
.mes .dia:hover{border-color:var(--sec)}
.mes .dia.fuera{opacity:.42}
.mes .dia.hoy .n{background:var(--sec); color:var(--on-sec); border-radius:999px; padding:1px 6px}
.mes .dia.sel{border-color:var(--sec); background:var(--surface); box-shadow:inset 0 0 0 1px var(--sec)}
.mes .dia .n{font-family:var(--mono); font-size:12px; color:var(--ink2); line-height:1.3}
.mes .dia .ps{display:flex; flex-wrap:wrap; gap:2px; justify-content:center; align-content:flex-start; min-height:12px}
.mes .dia .ps i{width:5px; height:5px; border-radius:50%; display:block}
.leyenda{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.leyenda span{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink2)}
.leyenda i{width:7px; height:7px; border-radius:50%}

/* ---------- avisos del inicio ---------- */
ul.avisos{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
ul.avisos li{
  display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:11px;
  background:var(--surface2); border-left:3px solid var(--ink3); font-size:13.5px;
}
ul.avisos li.urgente{border-left-color:var(--crit)}
ul.avisos li.pronto{border-left-color:var(--warn)}
ul.avisos li.info{border-left-color:var(--sec)}
ul.avisos .cuando{
  font-family:var(--mono); font-size:11.5px; color:var(--ink2); white-space:nowrap;
  padding-top:1px; flex:0 0 auto;
}
ul.avisos .qué{flex:1; min-width:0; overflow-wrap:anywhere}
ul.avisos .qué small{display:block; color:var(--ink3); font-size:11.5px}

/* ---------- calendario de la FP ---------- */
.mes .dia.entrega{background:#D1452F; border-color:#D1452F}
.mes .dia.entrega .n{color:#fff; font-weight:600}
.mes .dia.examen{background:#8E2C3C; border-color:#8E2C3C}
.mes .dia.examen .n{color:#fff; font-weight:600}
.mes .dia.clase{border-color:var(--sec)}
.mes .dia.entrega.hoy .n,.mes .dia.examen.hoy .n{background:#fff; color:#8E2C3C}
.mes .dia .et{font-size:8.5px; line-height:1.1; color:#fff; text-align:center; overflow:hidden; max-width:100%}

/* ---------- entregas ---------- */
ul.entregas{list-style:none; margin:0; padding:0}
ul.entregas li{display:flex; gap:10px; align-items:center; padding:10px 0; border-top:1px solid var(--line)}
ul.entregas li:first-child{border-top:0}
ul.entregas li.hecha .t{text-decoration:line-through; color:var(--ink3)}
ul.entregas .cuenta{
  font-family:var(--mono); font-size:11px; text-align:center; flex:0 0 auto; width:52px;
  border-radius:9px; padding:5px 2px; background:var(--surface2); color:var(--ink2); line-height:1.2;
}
ul.entregas .cuenta b{display:block; font-size:15px; font-weight:500; color:var(--ink)}
ul.entregas li.urgente .cuenta{background:#D1452F; color:#fff}
ul.entregas li.urgente .cuenta b{color:#fff}
ul.entregas li.pronto .cuenta{background:#A9762C; color:#fff}
ul.entregas li.pronto .cuenta b{color:#fff}
ul.entregas .t{flex:1; min-width:0; font-size:14px; font-weight:500; overflow-wrap:anywhere}
ul.entregas .t small{display:block; font-weight:400; color:var(--ink3); font-size:11.5px}
.horario{list-style:none; margin:0; padding:0}
.horario li{display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:13.5px}
.horario li:first-child{border-top:0}
.horario .d{width:76px; flex:0 0 auto; color:var(--ink2); text-transform:capitalize}
.horario .hh{font-family:var(--mono); color:var(--ink); flex:0 0 auto}
.horario .as{flex:1; min-width:0; color:var(--ink3); font-size:12.5px; text-align:right; overflow-wrap:anywhere}

/* ---------- personalizar el inicio ---------- */
ul.orden{list-style:none; margin:0; padding:0}
ul.orden li{display:flex; gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--line)}
ul.orden li:first-child{border-top:0}
ul.orden .nm{flex:1; min-width:0; font-size:14px}
ul.orden li.off .nm{color:var(--ink3); text-decoration:line-through}
ul.orden button{
  width:30px; height:30px; flex:0 0 auto; border:1px solid var(--line); background:var(--surface2);
  border-radius:9px; cursor:pointer; display:grid; place-items:center; font-size:14px; padding:0; line-height:1;
}
ul.orden button:hover{border-color:var(--sec)}
.kv{list-style:none; margin:0; padding:0}
.kv li{display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-top:1px solid var(--line); font-size:13.5px}
.kv li:first-child{border-top:0}
.kv .v{font-family:var(--mono); color:var(--ink2)}

/* ---------- apartados nuevos ---------- */
.subtabs{display:flex; gap:8px; flex-wrap:wrap}
.formgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-top:4px}
.formgrid label{display:flex; flex-direction:column; gap:4px; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); min-width:0}
.formgrid input,.formgrid textarea{
  background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:9px 10px;
  font-size:14px; font-family:var(--mono); min-width:0; width:100%;
}
.formgrid textarea{font-family:var(--body); resize:vertical; min-height:54px}
.formgrid .wide{grid-column:1/-1}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.stat{background:var(--surface2); border-radius:12px; padding:11px 12px; min-width:0}
.stat .k{font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink3)}
.stat .v{font-family:var(--mono); font-size:20px; font-weight:500; margin-top:3px; line-height:1.15}
.stat .d{font-size:11.5px; color:var(--ink3); font-family:var(--mono)}
figure.chart{margin:0; padding-top:6px}
figure.chart figcaption{font-size:12px; color:var(--ink3); margin-bottom:4px}
figure.chart svg{display:block; width:100%; height:auto; overflow:visible}
figure.chart .gl{stroke:var(--line); stroke-width:1}
figure.chart .ln{fill:none; stroke:var(--sec); stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
figure.chart .pt{fill:var(--sec); stroke:var(--surface); stroke-width:2}
figure.chart .lbl{font-family:var(--mono); font-size:10.5px; fill:var(--ink2)}
figure.chart .ax{font-family:var(--mono); font-size:10px; fill:var(--ink3)}
.tablewrap{overflow-x:auto; margin-top:4px}
table.data{width:100%; border-collapse:collapse; font-size:13px}
table.data th{
  text-align:left; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--ink3); font-weight:500; padding:0 10px 6px 0; white-space:nowrap;
}
table.data td{padding:7px 10px 7px 0; border-top:1px solid var(--line); font-family:var(--mono); white-space:nowrap}
table.data td:first-child{font-family:var(--body)}
table.data td:last-child{padding-right:0; text-align:right}
details.item{border-top:1px solid var(--line)}
details.item:first-of-type{border-top:0}
details.item>summary{list-style:none; cursor:pointer; padding:10px 0; display:flex; align-items:center; gap:10px}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary::after{content:"+"; color:var(--ink3); margin-left:auto; font-size:16px; line-height:1}
details.item[open]>summary::after{content:"–"}
details.item .nm{flex:1; min-width:0; font-size:14px; font-weight:500; overflow-wrap:anywhere}
details.item .nm small{display:block; font-weight:400; color:var(--ink3); font-size:11.5px; font-family:var(--mono)}
details.item .box{padding:0 0 12px}
details.item textarea{
  width:100%; min-height:68px; resize:vertical; background:var(--surface2);
  border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-size:13.5px;
}
details.item .acts{display:flex; gap:8px; margin-top:8px; align-items:center; flex-wrap:wrap}
.porque{font-size:13px; color:var(--ink2); margin:0 0 8px}
@media (min-width:560px){ .formgrid{grid-template-columns:repeat(3,1fr)} }

.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(92px + env(safe-area-inset-bottom)); z-index:70;
  background:var(--ink); color:var(--bg); padding:9px 15px; border-radius:999px; font-size:13px;
  max-width:calc(100% - 32px); text-align:center;
  opacity:0; pointer-events:none; transition:opacity .18s ease;
}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }

@media (min-width:900px){
  .secbtn .tx b{font-size:26px}
  .menu{left:16px}
  .fab{right:calc(50% - 440px + 12px)}
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="bar">
      <button class="secbtn" id="secbtn" aria-haspopup="true" aria-expanded="false" aria-controls="menu" title="Cambiar de sección">
        <span class="tile" id="secico" aria-hidden="true"></span>
        <span class="tx"><small>Agenda personal</small><b id="secname">Hoy</b></span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <span class="sp"></span>
      <button class="iconbtn" id="themebtn" title="Cambiar entre claro y oscuro" aria-label="Cambiar entre claro y oscuro"></button>
    </div>
    <div class="weekbar" id="weekbar">
      <button class="iconbtn" id="prevw" title="Semana anterior" aria-label="Semana anterior">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="label" id="weeklabel">—</div>
      <button class="pill" id="thisw">Hoy</button>
      <button class="iconbtn" id="nextw" title="Semana siguiente" aria-label="Semana siguiente">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <div class="menu" id="menu" role="menu" hidden></div>
  </header>

  <main id="view"></main>
</div>
<div class="scrim" id="scrim" hidden></div>
<button class="fab" id="fab" aria-label="Apunte rápido" title="Apunte rápido">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t" hidden>
  <div class="cab">
    <h2 id="sheet-t">Apunte rápido</h2><span class="sp"></span>
    <button class="iconbtn" id="sheet-x" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <input class="cap" id="cap" type="text" autocomplete="off" autocapitalize="sentences" enterkeyhint="done"
         placeholder="Escríbelo como lo dirías" aria-label="Qué quieres apuntar">
  <div class="lectura vacia" id="cap-lec">Escribe y te digo dónde lo guardo.</div>
  <div class="tipos" id="cap-tipos"></div>
  <div class="ejemplos" id="cap-ej"></div>
  <div class="btnrow"><button class="btn primary" id="cap-ok" style="flex:1; padding:12px">Guardar</button></div>
  <div class="hecho-ok" id="cap-hecho" role="status" aria-live="polite"></div>
</div>
<input type="file" id="importfile" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  /* ============ constantes ============ */
  var KEY = 'semana-serrana.v1';
  var ICONS = {
    hoy:'<path d="M12 3v3m0 12v3m9-9h-3M6 12H3m14.6-6.6l-2.1 2.1M8.5 15.5l-2.1 2.1m0-11.2l2.1 2.1m7 7l2.1 2.1"/><circle cx="12" cy="12" r="3.4"/>',
    agenda:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3.5V6m8-2.5V6"/>',
    entreno:'<path d="M6.5 9v6m11-6v6M4 10.5v3m16-3v3M6.5 12h11"/>',
    comida:'<path d="M7 3.5v7a2.5 2.5 0 005 0v-7M9.5 13v7.5M16 3.5c-1.4 1.2-2 3-2 5s.7 2.8 2 3v9"/>',
    banda:'<circle cx="8" cy="17.5" r="2.6"/><circle cx="18" cy="15.5" r="2.6"/><path d="M10.6 17.5V7l10-2v10.5"/>',
    estudio:'<path d="M4 5.5h6a2.5 2.5 0 012.5 2.5v11A2 2 0 0010.5 17H4zM20 5.5h-6A2.5 2.5 0 0011.5 8v11A2 2 0 0113.5 17H20z"/>'
  };
  var CATS = {
    trabajo:{n:'Trabajo', c:'var(--c-trabajo)'},
    trayecto:{n:'Trayecto', c:'var(--c-trayecto)'},
    ensayo:{n:'Ensayo', c:'var(--c-ensayo)'},
    entreno:{n:'Entreno', c:'var(--c-entreno)'},
    estudio:{n:'Estudio', c:'var(--c-estudio)'},
    comida:{n:'Comida', c:'var(--c-comida)'},
    casa:{n:'Personal', c:'var(--c-casa)'}
  };
  var MEALS = [['desayuno','Desayuno'],['media','Media mañana'],['almuerzo','Almuerzo'],['merienda','Merienda'],['cena','Cena']];
  var DAYNAMES = ['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
  var MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  /* ============ almacenamiento local ============ */
  function base(){
    return {meta:{app:'semana-serrana', version:1}, semanas:{}, estudio:{items:[]},
            medidas:{registros:[]}, repertorio:{marchas:[]},
            fp:{clases:[], entregas:[], modulos:[]}, config:{}};
  }
  var store = base(), storageOk = true;

  function loadStore(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var p = JSON.parse(raw);
        if(p && typeof p === 'object'){
          store = {
            meta: p.meta || {app:'semana-serrana', version:1},
            semanas: p.semanas || {},
            estudio: p.estudio || {items:[]},
            medidas: p.medidas || {registros:[]},
            repertorio: p.repertorio || {marchas:[]},
            fp: p.fp || {clases:[], entregas:[], modulos:[]},
            config: p.config || {}
          };
        }
      }
    }catch(e){ storageOk = false }
  }
  function persist(){
    try{
      store.meta.guardado = new Date().toISOString();
      localStorage.setItem(KEY, JSON.stringify(store));
    }catch(e){
      storageOk = false;
      toast('Este navegador no deja guardar datos (modo privado o almacenamiento lleno)');
    }
  }

  var state = {tab:'hoy', sub:'menu', subEntreno:'semana', subAgenda:'semana', subEstudio:'entregas',
               edit:false, editando:null, nuevoEn:null, mes:null, diaSel:null,
               mesFp:null, diaFp:null, editandoEntrega:null, nuevaEntrega:false, personaliza:false,
               monday:mondayOf(new Date())};

  /* ============ fechas ============ */
  function pad(n){ return n<10 ? '0'+n : ''+n }
  function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()) }
  function mondayOf(d){
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var w = (x.getDay()+6)%7; x.setDate(x.getDate()-w); return x;
  }
  function addDays(d,n){ var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x }
  function weekDates(){ var a=[]; for(var i=0;i<7;i++) a.push(addDays(state.monday,i)); return a }
  function longDate(d){ return d.getDate()+' de '+MONTHS[d.getMonth()] }
  function mins(t){ if(!t) return 0; var p=String(t).split(':'); return (+p[0])*60 + (+(p[1]||0)) }
  function dur(a,b){ var d=mins(b)-mins(a); return d<0 ? d+1440 : d }
  function hrs(m){
    if(m < 60) return m + ' min';
    var h=Math.floor(m/60), r=m%60;
    return r ? h+'h '+pad(r) : h+'h';
  }
  function wid(){ return iso(state.monday) }
  function isCurrentWeek(){ return iso(mondayOf(new Date())) === wid() }
  function validTime(t){ return /^([01]?\d|2[0-3]):[0-5]\d$/.test(t) }

  /* ============ acceso a datos ============ */
  function week(){ return store.semanas[wid()] || null }
  function d(key){ var w = week(); return (w && w[key]) || null }
  function save(key, data){
    if(!store.semanas[wid()]) store.semanas[wid()] = {};
    store.semanas[wid()][key] = data;
    persist();
  }
  function saveEstudio(data){ store.estudio = data; persist() }
  function medidas(){ return (store.medidas && store.medidas.registros) || [] }
  function saveMedidas(regs){ store.medidas = {registros:regs}; persist() }
  function marchas(){ return (store.repertorio && store.repertorio.marchas) || [] }
  function saveMarchas(ms){ store.repertorio = {marchas:ms}; persist() }

  /* ---------- FP: clases y entregas ---------- */
  function fp(){
    if(!store.fp) store.fp = {clases:[], entregas:[], modulos:[]};
    if(!store.fp.clases) store.fp.clases = [];
    if(!store.fp.entregas) store.fp.entregas = [];
    if(!store.fp.modulos) store.fp.modulos = [];
    return store.fp;
  }
  function saveFp(x){ store.fp = x; persist() }
  function entregas(){
    return fp().entregas.slice().sort(function(a,b){ return a.fecha < b.fecha ? -1 : (a.fecha > b.fecha ? 1 : 0) });
  }
  function entregasDe(f){ return entregas().filter(function(e){ return e.fecha === f }) }
  function clasesDe(f){
    var dow = ((fechaDe(f).getDay()+6) % 7) + 1;   // 1 = lunes
    return fp().clases.filter(function(c){ return Number(c.dia) === dow })
      .sort(function(a,b){ return mins(a.ini) - mins(b.ini) });
  }
  function diasHasta(f){
    var hoy = fechaDe(iso(new Date()));
    return Math.round((fechaDe(f) - hoy) / 86400000);
  }
  var TIPOS_FP = {
    entrega:{n:'Entrega', c:'#D1452F'},
    examen:{n:'Examen', c:'#8E2C3C'},
    practica:{n:'Práctica', c:'#2F6F9E'},
    clase:{n:'Clase', c:'#1F6B5E'},
    hito:{n:'Hito', c:'#A9762C'}
  };
  function tipoFp(t){ return TIPOS_FP[t] || TIPOS_FP.entrega }
  function nombreModulo(m){ return typeof m === 'string' ? m : (m && m.nombre) || '' }
  function nombresModulos(){ return fp().modulos.map(nombreModulo).filter(Boolean) }
  function num(v){ var n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null }
  function fmt(n, dec){ return n == null ? '—' : n.toFixed(dec == null ? 1 : dec).replace('.', ',') }
  function delta(a, b, dec){
    if(a == null || b == null) return '';
    var v = a - b;
    if(Math.abs(v) < 0.05) return ' · igual';
    return ' · ' + (v > 0 ? '+' : '−') + fmt(Math.abs(v), dec);
  }
  function clone(o){ return JSON.parse(JSON.stringify(o)) }
  function uid(){ return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,6) }

  /* ============ utilidades DOM ============ */
  function h(html){ var t=document.createElement('div'); t.innerHTML=html; return t }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }) }
  function card(title, eyebrow){
    var c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = (title ? '<div class="head"><h2>'+esc(title)+'</h2>'+(eyebrow?'<span class="eyebrow">'+esc(eyebrow)+'</span>':'')+'</div>' : '')+'<div class="body"></div>';
    c.body = c.querySelector('.body');
    return c;
  }
  function stack(){ var s=document.createElement('div'); s.className='stack'; return s }
  function banner(o){
    var el = document.createElement('div');
    el.className = 'banner' + (o.tall ? ' tall' : '');
    el.style.backgroundImage = 'url("img/' + o.img + '.webp")';
    if(o.pos) el.style.backgroundPosition = o.pos;
    el.setAttribute('role','img');
    el.setAttribute('aria-label', o.alt || 'Paisaje de sierra');
    var anillo = '';
    if(o.ring){
      var R = 26, L = 2 * Math.PI * R, pc = Math.max(0, Math.min(1, o.ring.pct));
      anillo = '<div class="ring" title="'+esc(o.ring.txt)+'"><svg viewBox="0 0 62 62"><circle class="tr" cx="31" cy="31" r="'+R+'"/>'+
        '<circle class="pr" cx="31" cy="31" r="'+R+'" stroke-dasharray="'+(L*pc).toFixed(1)+' '+L.toFixed(1)+'"/></svg>'+
        '<span>'+Math.round(pc*100)+'%</span></div>';
    }
    el.innerHTML = anillo + '<div class="inner">' +
      (o.eyebrow ? '<div class="eyebrow">'+esc(o.eyebrow)+'</div>' : '') +
      (o.day ? '<div class="day">'+esc(o.day)+'</div>' : '') +
      (o.title ? '<h2>'+esc(o.title)+'</h2>' : '') +
      (o.date ? '<div class="date">'+esc(o.date)+'</div>' : '') +
      (o.sub ? '<div class="sub">'+esc(o.sub)+'</div>' : '') +
      (o.chips ? '<div class="chips">'+o.chips+'</div>' : '') +
      '</div>';
    return el;
  }
  function imagenDelDia(){
    if(!isCurrentWeek()) return 'hoy';
    var hh = new Date().getHours();
    if(hh < 11) return 'hoy';
    if(hh < 18) return 'agenda';
    if(hh < 21) return 'entreno';
    return 'banda';
  }
  function altDelDia(){
    return ({hoy:'Amanecer sobre la serranía', agenda:'La serranía a mediodía',
             entreno:'Atardecer sobre la serranía', banda:'La serranía de noche'})[imagenDelDia()];
  }

    var el = document.getElementById('toast');

    {k:'hoy',     n:'Hoy',     c:'var(--c-hoy)'},

    {k:'entreno', n:'Entreno', c:'var(--c-entreno)', sub:[['semana','Semana'],['medidas','Medidas'],['mensual','Mensual']], est:'subEntreno'},
    {k:'comida',  n:'Comida',  c:'var(--c-comida)',  sub:[['menu','Menú'],['compra','Lista de la compra']], est:'sub'},
    {k:'banda',   n:'Banda',   c:'var(--c-ensayo)'},
    {k:'estudio', n:'Estudio', c:'var(--c-fp)',      sub:[['entregas','Entregas'],['calendario','Calendario'],['clases','Clases y audio']], est:'subEstudio'},
    {k:'datos',   n:'Datos y copias', c:'var(--accent)'}
  ];

    document.documentElement.dataset.sec = state.tab;
    document.getElementById('secname').textContent = sec.n;
    document.getElementById('secico').innerHTML = icono(sec.k);

    var ds = weekDates(), first = ds[0], last = ds[6];

      (first.getMonth() === last.getMonth() ? first.getDate() : corto(first)) + ' – ' + corto(last) +

  /* --- qué pasa hoy en cada sección: es lo que se lee en el desplegable --- */
  function estadoSeccion(k){
    var hoyIso = iso(new Date());
    var sem = store.semanas[widDe(hoyIso)] || {};
    if(k === 'hoy'){
      var n = avisosDe(hoyIso).filter(function(a){ return a.clase !== 'info' }).length;
      var b = blocksOf(hoyIso).length;
      return (n ? n + (n === 1 ? ' aviso · ' : ' avisos · ') : '') + (b ? b + ' cosas en el día' : 'día sin nada apuntado');
    }
    if(k === 'agenda'){
      var t = 0, lun = mondayOf(new Date());
      for(var i = 0; i < 7; i++) t += blocksOf(iso(addDays(lun, i))).length;
      return t ? t + ' eventos esta semana' : 'semana vacía';
    }
    if(k === 'entreno'){
      var ses = ((sem.entreno && sem.entreno.sesiones) || []).filter(function(x){ return x.fecha === hoyIso })[0];
      return ses ? 'Hoy: ' + ses.nombre + (ses.hecho ? ' · hecha' : '') : 'hoy no toca';
    }
    if(k === 'comida'){
      var pend = 0;
      ((sem.menu && sem.menu.compra && sem.menu.compra.secciones) || []).forEach(function(se){
        (se.items || []).forEach(function(it){ if(!it.ok) pend++ });
      });
      return pend ? pend + ' por comprar' : (sem.menu ? 'compra hecha' : 'sin menú esta semana');
    }
    if(k === 'banda'){
      for(var j = 0; j < 14; j++){
        var di = iso(addDays(new Date(), j));
        var e = blocksOf(di).filter(function(x){ return x.cat === 'ensayo' })[0];
        if(e) return 'Ensayo ' + (j === 0 ? 'hoy' : (j === 1 ? 'mañana' : DAYNAMES[(fechaDe(di).getDay()+6)%7])) + ' a las ' + e.ini;
      }
      return marchas().length ? marchas().length + ' marchas en repertorio' : 'sin ensayos a la vista';
    }
    if(k === 'estudio'){
      var sig = entregas().filter(function(x){ return x.estado !== 'entregado' && diasHasta(x.fecha) >= 0 })[0];
      if(!sig) return 'nada pendiente';
      var dd = diasHasta(sig.fecha);
      return tipoFp(sig.tipo).n + ' ' + (dd === 0 ? 'hoy' : (dd === 1 ? 'mañana' : 'en ' + dd + ' días')) + ': ' + sig.titulo;
    }
    return 'exportar, importar y mover a otro móvil';
  }

      if(sx.k === 'datos') m.appendChild(h('<div class="msep"></div>').firstChild);

      row.setAttribute('role', 'menuitem');
      row.style.setProperty('--t', sx.c);

      row.innerHTML = '<span class="tile" style="--t:'+sx.c+'">'+icono(sx.k)+'</span>'+

        (sx.k === state.tab ? '<span class="aqui">aquí</span>' : '');

          ch.addEventListener('click', function(){

  /* Los bloques se buscan y se guardan por FECHA, no por la semana que estés viendo:
     así se puede meter una cita de dentro de un mes sin cambiar de semana. */
  function fechaDe(f){ return new Date(f + 'T00:00:00') }
  function widDe(f){ return iso(mondayOf(fechaDe(f))) }
  function agendaDe(f){ var w = store.semanas[widDe(f)]; return (w && w.agenda) || null }

  function blocksOf(dayIso){
    var ag = agendaDe(dayIso);
    if(!ag || !ag.dias) return [];
    var day = ag.dias.filter(function(x){ return x.fecha === dayIso })[0];
    var bs = (day && day.bloques) ? day.bloques.slice() : [];
    bs.sort(function(a,b){ return mins(a.ini) - mins(b.ini) });
    return bs;
  }

  function guardaBloques(dayIso, fn){
    var wk = widDe(dayIso);
    if(!store.semanas[wk]) store.semanas[wk] = {};
    if(!store.semanas[wk].agenda) store.semanas[wk].agenda = {dias:[]};
    var ag = store.semanas[wk].agenda;
    if(!ag.dias) ag.dias = [];
    var dia = ag.dias.filter(function(x){ return x.fecha === dayIso })[0];
    if(!dia){ dia = {fecha:dayIso, bloques:[]}; ag.dias.push(dia) }
    if(!dia.bloques) dia.bloques = [];
    fn(dia, ag);
    dia.bloques.sort(function(a,b){ return mins(a.ini) - mins(b.ini) });
    if(!dia.bloques.length) ag.dias = ag.dias.filter(function(x){ return x.fecha !== dayIso });
    ag.dias.sort(function(a,b){ return a.fecha < b.fecha ? -1 : 1 });
    persist();
  }

  function guardaEvento(fechaOrig, bloque, dat){
    if(bloque && fechaOrig !== dat.fecha){
      guardaBloques(fechaOrig, function(dia){
        dia.bloques = dia.bloques.filter(function(x){ return x.id !== bloque.id });
      });
    }
    guardaBloques(dat.fecha, function(dia){
      var ex = bloque ? dia.bloques.filter(function(x){ return x.id === bloque.id })[0] : null;
      if(!ex){
        ex = {id: (bloque && bloque.id) || uid(), hecho: (bloque && bloque.hecho) || false};
        dia.bloques.push(ex);
      }
      ex.ini = dat.ini; ex.fin = dat.fin; ex.cat = dat.cat; ex.titulo = dat.titulo;
      if(dat.nota) ex.nota = dat.nota; else delete ex.nota;
    });
  }

  function borraEvento(dayIso, id){
    guardaBloques(dayIso, function(dia){
      dia.bloques = dia.bloques.filter(function(x){ return x.id !== id });
    });
  }

  /* Formulario de evento: sirve para crear y para editar. */
  function editorEvento(dayIso, bloque, alTerminar){
    var form = document.createElement('form');
    form.className = 'newblock';
    var opts = Object.keys(CATS).map(function(k){
      var sel = bloque ? (bloque.cat === k) : (k === 'casa');
      return '<option value="'+k+'"'+(sel?' selected':'')+'>'+CATS[k].n+'</option>';
    }).join('');
    var suf = bloque ? bloque.id : 'nuevo-' + dayIso;
    form.innerHTML =
      '<label class="wide">Qué es<input type="text" name="titulo" id="ev-t-'+suf+'" value="'+esc(bloque ? bloque.titulo : '')+'" placeholder="Cita con el dentista" required></label>'+
      '<label class="wide">Día<input type="date" name="fecha" id="ev-f-'+suf+'" value="'+dayIso+'" required></label>'+
      '<label>Desde<input type="time" name="ini" id="ev-i-'+suf+'" value="'+esc(bloque ? bloque.ini : '')+'" required></label>'+
      '<label>Hasta<input type="time" name="fin" id="ev-h-'+suf+'" value="'+esc(bloque ? bloque.fin : '')+'" required></label>'+
      '<label class="wide">Tipo<select name="cat" id="ev-c-'+suf+'">'+opts+'</select></label>'+
      '<label class="wide">Nota<input type="text" name="nota" id="ev-n-'+suf+'" value="'+esc(bloque && bloque.nota ? bloque.nota : '')+'" placeholder="Opcional"></label>'+
      '<div class="acciones">'+
        '<button class="btn primary" type="submit">'+(bloque ? 'Guardar cambios' : 'Añadir')+'</button>'+
        (bloque ? '<button class="btn danger" type="button" data-act="borrar">Borrar</button>' : '')+
        '<button class="btn" type="button" data-act="cancelar">Cancelar</button>'+
      '</div>';
    form.addEventListener('submit', function(ev){
      ev.preventDefault();
      var t = form.titulo.value.trim(), a = form.ini.value.trim(), b = form.fin.value.trim();
      if(!t){ toast('Ponle un título'); return }
      if(!validTime(a) || !validTime(b)){ toast('Faltan las horas'); return }
      guardaEvento(dayIso, bloque, {
        fecha: form.fecha.value || dayIso, ini: a, fin: b,
        cat: form.cat.value, titulo: t, nota: form.nota.value.trim()
      });
      alTerminar();
    });
    form.querySelector('[data-act="cancelar"]').addEventListener('click', alTerminar);
    var del = form.querySelector('[data-act="borrar"]');
    if(del) del.addEventListener('click', function(){
      if(!window.confirm('¿Borrar «'+bloque.titulo+'»?')) return;
      borraEvento(dayIso, bloque.id);
      alTerminar();
    });
    return form;
  }

  function blockList(dayIso, opts){
    opts = opts || {};
    var bs = blocksOf(dayIso);
    var ul = document.createElement('ul');
    ul.className = 'blocks';
    if(!bs.length){
      var li = document.createElement('li');
      li.innerHTML = '<span class="muted small">Sin bloques para este día.</span>';
      ul.appendChild(li);
      return ul;
    }
    var now = new Date(), nowM = now.getHours()*60 + now.getMinutes(), today = iso(now);
    bs.forEach(function(b){
      var cat = CATS[b.cat] || CATS.casa;
      var isNow = opts.markNow && dayIso === today && mins(b.ini) <= nowM && nowM < mins(b.ini) + dur(b.ini, b.fin);
      var li = document.createElement('li');
      li.className = (b.hecho ? 'done ' : '') + (isNow ? 'now' : '');
      var conAcciones = opts.acciones || (state.edit && opts.editable);
      li.innerHTML =
        '<div class="time mono">'+esc(b.ini)+'<span>'+esc(b.fin)+'</span></div>'+
        '<div class="stripe" style="background:'+cat.c+'"></div>'+
        '<div class="bmain"><div class="title">'+esc(b.titulo)+'</div>'+
        '<div class="meta">'+esc(cat.n)+' · '+hrs(dur(b.ini,b.fin))+(b.nota ? ' · '+esc(b.nota) : '')+(isNow?' · ahora':'')+'</div></div>'+
        '<button class="tick" aria-pressed="'+(b.hecho?'true':'false')+'" aria-label="Marcar hecho"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4.5 4.5L19 7"/></svg></button>'+
        (conAcciones
          ? '<button class="tick" data-act="editar" aria-label="Editar evento"><svg viewBox="0 0 24 24" aria-hidden="true" style="opacity:1"><path d="M4 20h4l10-10-4-4L4 16z"/></svg></button>'
          : '');
      var tick = li.querySelector('.tick:not([data-act])');
      if(tick) tick.addEventListener('click', function(){
        guardaBloques(dayIso, function(dia){
          dia.bloques.forEach(function(x){ if(x.id === b.id) x.hecho = !x.hecho });
        });
        render();
      });
      var ed = li.querySelector('[data-act="editar"]');
      if(ed) ed.addEventListener('click', function(){
        state.editando = (state.editando && state.editando.id === b.id) ? null : {fecha:dayIso, id:b.id};
        render();
      });
      ul.appendChild(li);
      if(state.editando && state.editando.id === b.id && state.editando.fecha === dayIso){
        var liEd = document.createElement('li');
        liEd.className = 'editor';
        liEd.appendChild(editorEvento(dayIso, b, function(){ state.editando = null; render() }));
        ul.appendChild(liEd);
      }
    });
    return ul;
  }

  /* ============ INICIO (HOY) ============ */
  var SECCIONES_INICIO = [
    {k:'avisos',   n:'Avisos'},
    {k:'bloques',  n:'El día, por bloques'},
    {k:'clases',   n:'Clases de hoy'},
    {k:'entregas', n:'Entregas que vienen'},
    {k:'comidas',  n:'Comidas de hoy'},
    {k:'entreno',  n:'Entreno de hoy'}
  ];
  function confInicio(){
    if(!store.config) store.config = {};
    var c = store.config.inicio;
    if(!c || !c.orden) c = {orden: SECCIONES_INICIO.map(function(x){ return x.k }), off:{}};
    // secciones nuevas que aún no estén en el orden guardado
    SECCIONES_INICIO.forEach(function(x){ if(c.orden.indexOf(x.k) < 0) c.orden.push(x.k) });
    c.orden = c.orden.filter(function(k){
      return SECCIONES_INICIO.some(function(x){ return x.k === k });
    });
    if(!c.off) c.off = {};
    store.config.inicio = c;
    return c;
  }
  function guardaInicio(c){
    if(!store.config) store.config = {};
    store.config.inicio = c;
    persist();
  }
  function nombreSeccion(k){
    var x = SECCIONES_INICIO.filter(function(y){ return y.k === k })[0];
    return x ? x.n : k;
  }

  /* --- los avisos del día --- */
  function avisosDe(dayIso){
    var av = [], hoyIso = iso(new Date());
    var now = new Date(), nowM = now.getHours()*60 + now.getMinutes();

    clasesDe(dayIso).forEach(function(c){
      var enCurso = dayIso === hoyIso && mins(c.ini) <= nowM && nowM < mins(c.fin);
      av.push({
        clase: enCurso ? 'urgente' : 'info',
        cuando: c.ini,
        qué: 'Clase de la FP' + (c.asignatura ? ': ' + c.asignatura : ''),
        detalle: c.ini + ' a ' + c.fin + (enCurso ? ' · está empezada' : '')
      });
    });

    entregas().forEach(function(e){
      if(e.estado === 'entregado') return;
      var dd = diasHasta(e.fecha);
      if(dd < 0 || dd > 10) return;
      av.push({
        clase: dd <= 2 ? 'urgente' : (dd <= 5 ? 'pronto' : 'info'),
        cuando: dd === 0 ? 'HOY' : (dd === 1 ? 'mañana' : 'en ' + dd + 'd'),
        qué: tipoFp(e.tipo).n + ': ' + e.titulo,
        detalle: (e.modulo ? e.modulo + ' · ' : '') + cortoFecha(e.fecha)
      });
    });

    entregas().forEach(function(e){
      if(e.estado === 'entregado') return;
      if(diasHasta(e.fecha) !== -1) return;
      av.push({clase:'urgente', cuando:'ayer', qué:'Sin marcar: ' + e.titulo, detalle:'¿lo entregaste?'});
    });

    var trabajo = blocksOf(dayIso).filter(function(b){ return b.cat === 'trabajo' })[0];
    if(trabajo){
      var ida = blocksOf(dayIso).filter(function(b){ return b.cat === 'trayecto' && b.fin === trabajo.ini })[0];
      av.push({clase:'info', cuando:trabajo.ini, qué:trabajo.titulo || 'Trabajo',
               detalle:trabajo.ini + ' a ' + trabajo.fin + (ida ? ' · sales a las ' + ida.ini : '')});
    }
    var ensayo = blocksOf(dayIso).filter(function(b){ return b.cat === 'ensayo' })[0];
    if(ensayo){
      av.push({clase:'info', cuando:ensayo.ini, qué:'Ensayo', detalle:ensayo.ini + ' a ' + ensayo.fin + (ensayo.nota ? ' · ' + ensayo.nota : '')});
    }
    av.sort(function(a,b){
      var pr = {urgente:0, pronto:1, info:2};
      return pr[a.clase] - pr[b.clase];
    });
    return av;
  }
  function hhAntes(t, m){
    var v = mins(t) - m; if(v < 0) v += 1440;
    return pad(Math.floor(v/60)) + ':' + pad(v%60);
  }

  function seccionInicio(k, dayIso){
    if(k === 'avisos'){
      var av = avisosDe(dayIso);
      var c = card('Avisos', av.length ? String(av.length) : 'nada urgente');
      if(av.length){
        var ul = document.createElement('ul'); ul.className = 'avisos';
        av.forEach(function(a){
          ul.appendChild(h('<li class="'+a.clase+'"><span class="cuando">'+esc(a.cuando)+'</span>'+
            '<span class="qué">'+esc(a.qué)+'<small>'+esc(a.detalle||'')+'</small></span></li>').firstChild);
        });
        c.body.appendChild(ul);
      } else {
        c.body.innerHTML = '<div class="muted small">Nada que vigilar hoy: sin clases, sin entregas cerca y sin avisos.</div>';
      }
      return c;
    }
    if(k === 'bloques'){
      var c1 = card('El día, por bloques');
      c1.body.appendChild(blockList(dayIso, {markNow:true}));
      return c1;
    }
    if(k === 'clases'){
      var cl = clasesDe(dayIso);
      var c2 = card('Clases de hoy', 'FP');
      if(cl.length){
        var ulc = document.createElement('ul'); ulc.className = 'horario';
        cl.forEach(function(x){
          ulc.appendChild(h('<li><span class="hh">'+esc(x.ini)+'–'+esc(x.fin)+'</span>'+
            '<span class="as">'+esc(x.asignatura || 'Clase online')+'</span></li>').firstChild);
        });

  function vistaMes(s){
    var m = mesActual();
    var hoyIso = iso(new Date());
    var ini = mondayOf(new Date(m.getFullYear(), m.getMonth(), 1));
    var celdas = [];
    for(var i = 0; i < 42; i++){
      var dt = addDays(ini, i);
      celdas.push(dt);
      if(i >= 34 && dt.getMonth() !== m.getMonth() && (i+1) % 7 === 0) break;
    }

    var c = card('Mes');
    var head = c.querySelector('.head');
    head.innerHTML = '';
    var prev = document.createElement('button');
    prev.className = 'iconbtn'; prev.setAttribute('aria-label','Mes anterior');
    prev.innerHTML = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
    prev.addEventListener('click', function(){
      state.mes = iso(new Date(m.getFullYear(), m.getMonth()-1, 1)); render();
    });
    var titulo = document.createElement('h2');
    titulo.style.textAlign = 'center';
    titulo.textContent = MONTHS[m.getMonth()].charAt(0).toUpperCase() + MONTHS[m.getMonth()].slice(1) + ' ' + m.getFullYear();
    var next = document.createElement('button');
    next.className = 'iconbtn'; next.setAttribute('aria-label','Mes siguiente');
    next.innerHTML = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
    next.addEventListener('click', function(){
      state.mes = iso(new Date(m.getFullYear(), m.getMonth()+1, 1)); render();
    });
    head.appendChild(prev); head.appendChild(titulo); head.appendChild(next);

    var grid = document.createElement('div');
    grid.className = 'mes';
    ['L','M','X','J','V','S','D'].forEach(function(n){
      grid.appendChild(h('<div class="cab">'+n+'</div>').firstChild);
    });
    var usadas = {}, totalEventos = 0;
    celdas.forEach(function(dt){
      var di = iso(dt);
      var bs = blocksOf(di);
      var cats = [];
      bs.forEach(function(b){ if(cats.indexOf(b.cat) < 0) cats.push(b.cat); usadas[b.cat] = true });
      if(dt.getMonth() === m.getMonth()) totalEventos += bs.length;
      var btn = document.createElement('button');
      btn.className = 'dia' + (dt.getMonth() !== m.getMonth() ? ' fuera' : '') +
        (di === hoyIso ? ' hoy' : '') + (di === state.diaSel ? ' sel' : '');
      btn.setAttribute('aria-label', dt.getDate() + ' de ' + MONTHS[dt.getMonth()] + ', ' + bs.length + ' eventos');
      btn.innerHTML = '<span class="n">'+dt.getDate()+'</span><span class="ps">'+
        cats.slice(0,6).map(function(k){ return '<i style="background:'+(CATS[k]||CATS.casa).c+'"></i>' }).join('')+
        '</span>';
      btn.addEventListener('click', function(){
        state.diaSel = state.diaSel === di ? null : di;
        state.editando = null; state.nuevoEn = null;
        render();
      });
      grid.appendChild(btn);
    });
    c.body.appendChild(grid);

    var ley = document.createElement('div'); ley.className = 'leyenda';
    Object.keys(CATS).forEach(function(k){
      if(!usadas[k]) return;
      ley.appendChild(h('<span><i style="background:'+CATS[k].c+'"></i>'+CATS[k].n+'</span>').firstChild);
    });
    if(ley.childNodes.length) c.body.appendChild(ley);
    c.body.appendChild(h('<div class="hint">'+(totalEventos ? totalEventos+' eventos este mes. Toca un día para verlo, editarlo o añadir una cita.' : 'Mes sin eventos. Toca un día para añadir el primero.')+'</div>').firstChild);
    s.appendChild(c);

    if(state.diaSel){
      var dsel = fechaDe(state.diaSel);
      var cd = card(DAYNAMES[(dsel.getDay()+6)%7].charAt(0).toUpperCase() + DAYNAMES[(dsel.getDay()+6)%7].slice(1) + ' ' + dsel.getDate(),
                    state.diaSel === hoyIso ? 'hoy' : MONTHS[dsel.getMonth()]);
      cd.body.appendChild(blockList(state.diaSel, {markNow:true, acciones:true}));
      cd.body.appendChild(botonAnadir(state.diaSel));
      if(state.nuevoEn === state.diaSel){
        cd.body.appendChild(editorEvento(state.diaSel, null, function(){ state.nuevoEn = null; render() }));
      }
      var irSemana = document.createElement('button');
      irSemana.className = 'btn'; irSemana.style.marginTop = '10px'; irSemana.style.marginLeft = '8px';
      irSemana.textContent = 'Ver esa semana';
      irSemana.addEventListener('click', function(){
        state.monday = mondayOf(dsel);
        state.subAgenda = 'semana';
        render(); window.scrollTo({top:0});
      });
      cd.body.appendChild(irSemana);
      s.appendChild(cd);
    }
    return s;
  }

  /* ---------- gráfica de una serie ---------- */
  function lineChart(puntos, titulo, unidad, dec){
    var W = 320, H = 110, L = 34, R = 12, T = 10, B = 20;
    var ys = puntos.map(function(p){ return p.y });
    var min = Math.min.apply(null, ys), max = Math.max.apply(null, ys);
    if(max - min < 0.6){ min -= 0.4; max += 0.4 }
    var pad = (max - min) * 0.12; min -= pad; max += pad;
    var px = function(i){ return L + (puntos.length === 1 ? (W-L-R)/2 : i * (W - L - R) / (puntos.length - 1)) };
    var py = function(v){ return T + (max - v) / (max - min) * (H - T - B) };
    var g = '';
    [max, (max+min)/2, min].forEach(function(v){
      g += '<line class="gl" x1="'+L+'" y1="'+py(v).toFixed(1)+'" x2="'+W+'" y2="'+py(v).toFixed(1)+'"/>'+
           '<text class="ax" x="0" y="'+(py(v)+3.5).toFixed(1)+'">'+fmt(v, dec)+'</text>';
    });
    var dpath = puntos.map(function(p,i){ return (i?'L':'M') + px(i).toFixed(1) + ' ' + py(p.y).toFixed(1) }).join(' ');
    var pts = puntos.map(function(p,i){
      return '<circle class="pt" cx="'+px(i).toFixed(1)+'" cy="'+py(p.y).toFixed(1)+'" r="4">'+
             '<title>'+esc(p.etiqueta)+': '+fmt(p.y, dec)+' '+esc(unidad)+'</title></circle>';
    }).join('');
    var ultimo = puntos[puntos.length-1];
    var lbl = '<text class="lbl" x="'+Math.min(px(puntos.length-1), W-26).toFixed(1)+'" y="'+(py(ultimo.y)-10).toFixed(1)+'" text-anchor="middle">'+fmt(ultimo.y, dec)+'</text>';
    var ejex = '<text class="ax" x="'+L+'" y="'+(H-4)+'">'+esc(puntos[0].etiqueta)+'</text>'+
               (puntos.length>1 ? '<text class="ax" x="'+W+'" y="'+(H-4)+'" text-anchor="end">'+esc(ultimo.etiqueta)+'</text>' : '');
    var f = document.createElement('figure');
    f.className = 'chart';
    f.innerHTML = '<figcaption>'+esc(titulo)+'</figcaption>'+
      '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(titulo)+', evolución de '+
      fmt(puntos[0].y,dec)+' a '+fmt(ultimo.y,dec)+' '+esc(unidad)+'">'+
      g + '<path class="ln" d="'+dpath+'"/>' + pts + lbl + ejex + '</svg>';
    return f;
  }

  function cortoFecha(f){
    var dt = new Date(f + 'T00:00:00');
    return dt.getDate() + ' ' + MONTHS[dt.getMonth()].slice(0,3);
  }

  /* ---------- ENTRENO · medidas ---------- */
  function vistaMedidas(s){
    var regs = medidas().slice().sort(function(a,b){ return a.fecha < b.fecha ? -1 : 1 });
    var ult = regs[regs.length-1], ant = regs[regs.length-2];

    var c0 = card('Última medición', ult ? cortoFecha(ult.fecha) : 'sin datos');
    if(ult){
      var st = document.createElement('div'); st.className = 'stats';
      [['peso','Peso','kg'],['grasa','% grasa',''],['musculo','% músculo','']].forEach(function(f){
        var v = num(ult[f[0]]), p = ant ? num(ant[f[0]]) : null;
        st.appendChild(h('<div class="stat"><div class="k">'+f[1]+'</div>'+
          '<div class="v">'+fmt(v)+(f[2]?' <span style="font-size:12px">'+f[2]+'</span>':'')+'</div>'+
          '<div class="d">'+(p!=null ? 'antes '+fmt(p)+delta(v,p) : 'primera')+'</div></div>').firstChild);
      });
      c0.body.appendChild(st);
      var otras = CAMPOS_MEDIDA.slice(3).filter(function(f){ return num(ult[f[0]]) != null });
      if(otras.length){
        var ul = document.createElement('ul'); ul.className = 'kv'; ul.style.marginTop = '12px';
        otras.forEach(function(f){
          var v = num(ult[f[0]]), p = ant ? num(ant[f[0]]) : null;
          ul.appendChild(h('<li><span>'+f[1]+'</span><span class="v">'+fmt(v)+(p!=null?delta(v,p):'')+'</span></li>').firstChild);
        });
        c0.body.appendChild(ul);
      }
      if(ult.notas) c0.body.appendChild(h('<div class="note" style="margin-top:12px">'+esc(ult.notas)+'</div>').firstChild);
    } else {
      c0.body.innerHTML = '<div class="muted small">Todavía no has apuntado ninguna medición. Rellena la de abajo y tendrás el punto de partida.</div>';
    }
    s.appendChild(c0);

    if(regs.length >= 2){
      var c1 = card('Evolución');
      [['peso','Peso corporal','kg'],['grasa','Grasa corporal','%'],['musculo','Masa muscular','%'],['cintura','Cintura','cm']].forEach(function(f){
        var ps = regs.filter(function(r){ return num(r[f[0]]) != null })
                     .map(function(r){ return {y:num(r[f[0]]), etiqueta:cortoFecha(r.fecha)} });
        if(ps.length >= 2) c1.body.appendChild(lineChart(ps, f[1]+' ('+f[2]+')', f[2], 1));
      });
      if(c1.body.childNodes.length) s.appendChild(c1);
    }

    var c2 = card('Apuntar medición');
    var form = document.createElement('form');
    form.className = 'formgrid';
    form.innerHTML = '<label class="wide">Fecha<input type="date" name="fecha" id="m-fecha" value="'+iso(new Date())+'" required></label>' +
      CAMPOS_MEDIDA.map(function(f){
        return '<label>'+f[1]+'<input type="text" inputmode="decimal" name="'+f[0]+'" id="m-'+f[0]+'" placeholder="—"></label>';
      }).join('') +
      '<label class="wide">Notas<textarea name="notas" id="m-notas" placeholder="Cómo te ves, hidratación, hora del día…"></textarea></label>' +
      '<div class="wide"><button class="btn primary" type="submit">Guardar medición</button></div>';
    form.addEventListener('submit', function(ev){
      ev.preventDefault();
      var r = {fecha: form.fecha.value || iso(new Date())};
      var algo = false;
      CAMPOS_MEDIDA.forEach(function(f){
        var v = form[f[0]].value.trim();
        if(v){ r[f[0]] = v; algo = true }
      });
      if(form.notas.value.trim()) r.notas = form.notas.value.trim();
      if(!algo){ toast('Rellena al menos un dato'); return }
      var ms = medidas().filter(function(x){ return x.fecha !== r.fecha });
      ms.push(r);
      ms.sort(function(a,b){ return a.fecha < b.fecha ? -1 : 1 });
      saveMedidas(ms);
      toast('Medición guardada');
      render();
    });
    c2.body.appendChild(form);
    c2.body.appendChild(h('<div class="hint">Mídete siempre igual: en ayunas, por la mañana y el mismo día de la semana. Si repites fecha, la nueva sustituye a la anterior.</div>').firstChild);
    s.appendChild(c2);

    if(regs.length){
      var c3 = card('Historial', regs.length + (regs.length===1?' medición':' mediciones'));
      var w = document.createElement('div'); w.className = 'tablewrap';
      var t = document.createElement('table'); t.className = 'data';
      t.innerHTML = '<thead><tr><th>Fecha</th><th>Peso</th><th>% grasa</th><th>% músc.</th><th>Cintura</th><th></th></tr></thead>';
      var tb = document.createElement('tbody');
      regs.slice().reverse().forEach(function(r){
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>'+cortoFecha(r.fecha)+'</td><td>'+fmt(num(r.peso))+'</td><td>'+fmt(num(r.grasa))+
          '</td><td>'+fmt(num(r.musculo))+'</td><td>'+fmt(num(r.cintura))+'</td>'+
          '<td><button class="del" aria-label="Borrar medición del '+esc(r.fecha)+'">&times;</button></td>';
        tr.querySelector('.del').addEventListener('click', function(){
          if(!window.confirm('¿Borrar la medición del '+cortoFecha(r.fecha)+'?')) return;
          saveMedidas(medidas().filter(function(x){ return x.fecha !== r.fecha }));
          render();
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb); w.appendChild(t); c3.body.appendChild(w);
      s.appendChild(c3);
    }
    return s;
  }

  /* ---------- ENTRENO · seguimiento mensual ---------- */
  function vistaMensual(s){
    var meses = {};
    function mes(k){
      if(!meses[k]) meses[k] = {sesiones:0, hechas:0, series:0, volumen:0, minutos:0, medidas:[]};
      return meses[k];
    }
    Object.keys(store.semanas || {}).forEach(function(wk){
      var en = store.semanas[wk].entreno;
      (en && en.sesiones || []).forEach(function(ses){
        var k = String(ses.fecha).slice(0,7);
        var m = mes(k);
        m.sesiones++;
        if(ses.hecho) m.hechas++;
        if(ses.hecho && ses.duracion) m.minutos += Number(ses.duracion) || 0;
        (ses.ejercicios||[]).forEach(function(ex){
          (ex.series||[]).forEach(function(serie){
            var kg = num(serie.kg), reps = num(serie.reps);
            if(reps != null){ m.series++; if(kg != null) m.volumen += kg * reps }
          });
        });
      });
    });
    medidas().forEach(function(r){ mes(String(r.fecha).slice(0,7)).medidas.push(r) });

    var keys = Object.keys(meses).sort().reverse();
    if(!keys.length){
      s.appendChild(emptyCard('Aún no hay nada que resumir. En cuanto marques sesiones como hechas y apuntes alguna medición, aquí verás mes a mes cuánto has entrenado y cómo han cambiado tus medidas.'));
      return s;
    }
    keys.forEach(function(k){
      var m = meses[k];
      var partes = k.split('-');
      var titulo = MONTHS[(+partes[1])-1].charAt(0).toUpperCase() + MONTHS[(+partes[1])-1].slice(1) + ' ' + partes[0];
      var c = card(titulo, m.hechas + ' de ' + m.sesiones + ' sesiones');
      var st = document.createElement('div'); st.className = 'stats';
      st.appendChild(h('<div class="stat"><div class="k">Sesiones hechas</div><div class="v">'+m.hechas+'</div>'+
        '<div class="d">de '+m.sesiones+' previstas</div></div>').firstChild);
      st.appendChild(h('<div class="stat"><div class="k">Series apuntadas</div><div class="v">'+m.series+'</div>'+
        '<div class="d">'+(m.minutos ? hrs(m.minutos)+' de gimnasio' : 'sin tiempo registrado')+'</div></div>').firstChild);
      st.appendChild(h('<div class="stat"><div class="k">Volumen</div><div class="v">'+
        (m.volumen ? Math.round(m.volumen).toLocaleString('es-ES') : '—')+'</div>'+
        '<div class="d">kg levantados</div></div>').firstChild);
      c.body.appendChild(st);

      if(m.medidas.length){
        var ms = m.medidas.slice().sort(function(a,b){ return a.fecha < b.fecha ? -1 : 1 });
        var pri = ms[0], ult = ms[ms.length-1];
        var ul = document.createElement('ul'); ul.className = 'kv'; ul.style.marginTop = '12px';
        [['peso','Peso'],['grasa','% grasa'],['musculo','% músculo'],['cintura','Cintura']].forEach(function(f){
          var a = num(pri[f[0]]), b = num(ult[f[0]]);
          if(a == null && b == null) return;
          var txt = ms.length > 1 && a != null && b != null
            ? fmt(a)+' → '+fmt(b)+delta(b, a)
            : fmt(b != null ? b : a);
          ul.appendChild(h('<li><span>'+f[1]+'</span><span class="v">'+txt+'</span></li>').firstChild);
        });
        if(ul.childNodes.length) c.body.appendChild(ul);
        c.body.appendChild(h('<div class="hint">'+ms.length+(ms.length===1?' medición este mes':' mediciones este mes')+'</div>').firstChild);
      } else {
        c.body.appendChild(h('<div class="hint">Sin mediciones este mes.</div>').firstChild);
      }
      s.appendChild(c);
    });
    return s;
  }

  /* ============ COMIDA ============ */
  function viewComida(){

  /* ---------- COMIDA · lista de la compra ---------- */
  var EXTRAS = 'Añadido a mano';
  function guardaCompra(fn){
    var nx = clone(d('menu') || {dias:[], compra:{secciones:[], presupuesto:[60,80]}});
    if(!nx.compra) nx.compra = {secciones:[], presupuesto:[60,80]};
    if(!nx.compra.secciones) nx.compra.secciones = [];
    fn(nx.compra);
    save('menu', nx);
  }

  function vistaCompra(s, mn){
    var compra = (mn && mn.compra) || {secciones:[]};
    var secs = compra.secciones || [];
    var total = 0, done = 0;
    secs.forEach(function(sec){ (sec.items||[]).forEach(function(it){ total++; if(it.ok) done++ }) });

    var head = card('Compra en Mercadona', total ? done+' de '+total : 'lista vacía');
    var cost = compra.coste || 0, top = (compra.presupuesto && compra.presupuesto[1]) || 80;
    if(cost){
      var pc = Math.min(100, Math.round(cost/top*100));
      head.body.innerHTML = '<div style="display:flex; align-items:baseline; gap:8px">'+
        '<span class="mono" style="font-size:24px; font-weight:500">'+Number(cost).toFixed(0)+' €</span>'+
        '<span class="muted" style="font-size:13px">estimado · tope '+top+' €</span></div>'+
        '<div class="meter'+(cost>top?' over':'')+'"><i style="width:'+pc+'%"></i></div>'+
        '<div class="hint">Precios aproximados de webs que replican el catálogo de Mercadona; el ticket final puede variar.</div>';
    } else {
      head.body.innerHTML = '<div class="muted small">La lista de la compra de la semana llega con el menú del lunes. Mientras tanto, añade aquí lo que te vaya haciendo falta.</div>';
    }
    var addrow = document.createElement('div'); addrow.className = 'addrow';
    var inp = document.createElement('input');
    inp.id = 'newitem'; inp.placeholder = 'Añadir producto (ej.: café molido 250 g)';
    inp.setAttribute('aria-label', 'Nuevo producto');
    var add = document.createElement('button'); add.className = 'btn primary'; add.textContent = 'Añadir';
    function addItem(){
      var t = inp.value.trim(); if(!t) return;
      var cant = '';
      var m = t.match(/\s(\d[\d.,]*\s*(?:kg|g|l|ml|uds?|unidades?|paquetes?|latas?|botes?|bolsas?))$/i);
      if(m){ cant = m[1]; t = t.slice(0, m.index).trim() }
      guardaCompra(function(c){
        var sec = c.secciones.filter(function(x){ return x.nombre === EXTRAS })[0];
        if(!sec){ sec = {nombre:EXTRAS, items:[]}; c.secciones.push(sec) }
        sec.items.push({n:t, cant:cant, ok:false});
      });
      inp.value = '';
      render();
    }
    add.addEventListener('click', addItem);
    inp.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); addItem() } });
    addrow.appendChild(inp); addrow.appendChild(add);
    head.body.appendChild(addrow);
    if(done){
      var clr = document.createElement('button');
      clr.className = 'btn'; clr.style.marginTop = '8px'; clr.textContent = 'Desmarcar todo';
      clr.addEventListener('click', function(){
        guardaCompra(function(c){ c.secciones.forEach(function(sec){ (sec.items||[]).forEach(function(it){ it.ok = false }) }) });
        render();
      });
      head.body.appendChild(clr);
    }
    s.appendChild(head);

    if(!secs.length){
      s.appendChild(emptyCard('La lista está vacía. Escribe arriba lo que necesites y se irá guardando aquí.'));
      return s;
    }

    secs.forEach(function(sec, seci){
      var pend = (sec.items||[]).filter(function(it){ return !it.ok }).length;
      var c = card(sec.nombre, pend ? pend+' por coger' : 'completa');
      var ul = document.createElement('ul'); ul.className='shop';
      (sec.items||[]).forEach(function(it, ii){
        var li = document.createElement('li');
        if(it.ok) li.className='on';
        li.innerHTML = '<button class="tick" aria-pressed="'+(it.ok?'true':'false')+'" aria-label="Marcar comprado">'+
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4.5 4.5L19 7"/></svg></button>'+
          '<span class="n">'+esc(it.n)+'</span><span class="q">'+esc(it.cant||'')+'</span>'+
          '<button class="del" aria-label="Quitar de la lista">&times;</button>';
        li.querySelector('.tick').addEventListener('click', function(){
          guardaCompra(function(c){ c.secciones[seci].items[ii].ok = !c.secciones[seci].items[ii].ok });
          render();
        });
        li.querySelector('.del').addEventListener('click', function(){
          guardaCompra(function(c){
            c.secciones[seci].items.splice(ii, 1);
            if(!c.secciones[seci].items.length) c.secciones.splice(seci, 1);
          });
          render();
        });
        ul.appendChild(li);
      });
      c.body.appendChild(ul);
      s.appendChild(c);
    });
    return s;
  }
