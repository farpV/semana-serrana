<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda personal</title>
<meta name="description" content="Agenda, entreno y medidas, menú y compra, banda y estudio. Los datos se guardan solo en este dispositivo.">
<meta name="theme-color" content="#F2F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1513" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>
/* El tema se fija antes de pintar, para que no parpadee. Claro por defecto. */
(function(){
  var t = 'light';
  try{ t = localStorage.getItem('semana-serrana.tema') || 'light' }catch(e){}
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
:root{
  --bg:#F7F9F6; --surface:#FFFFFF; --surface2:#ECF0EC; --line:#DCE2DD;
  --ink:#141A18; --ink2:#5B6663; --ink3:#8A9591;
  --accent:#1F6B5E; --accent-ink:#FFFFFF; --accent-soft:#DCEAE5;
  --c-trabajo:#3C6491; --c-trayecto:#A9762C; --c-ensayo:#7E5490;
  --c-entreno:#B3453C; --c-estudio:#1F6B5E; --c-comida:#6E8C2E; --c-casa:#6B7370;
  --ok:#2E7D5B; --warn:#A9762C; --crit:#B3453C;
  --shadow:0 1px 2px rgba(20,26,24,.05), 0 10px 30px -12px rgba(20,40,34,.28);
  --r:18px;
  --sec:#1F6B5E; --on-sec:#FFFFFF;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A211F; --surface:#232B29; --surface2:#2C3634; --line:#3A4543;
    --ink:#EAF0ED; --ink2:#A8B4B0; --ink3:#828E8A;
    --accent:#4FB09C; --accent-ink:#08211C; --accent-soft:#17322C;
    --c-trabajo:#7FA6D4; --c-trayecto:#D7A55C; --c-ensayo:#B58CC6;
    --c-entreno:#E0786D; --c-estudio:#4FB09C; --c-comida:#A3C25E; --c-casa:#97A29E;
    --ok:#5BBF93; --warn:#D7A55C; --crit:#E0786D; --on-sec:#0E1412;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A211F; --surface:#232B29; --surface2:#2C3634; --line:#3A4543;
  --ink:#EAF0ED; --ink2:#A8B4B0; --ink3:#828E8A;
  --accent:#4FB09C; --accent-ink:#08211C; --accent-soft:#17322C;
  --c-trabajo:#7FA6D4; --c-trayecto:#D7A55C; --c-ensayo:#B58CC6;
  --c-entreno:#E0786D; --c-estudio:#4FB09C; --c-comida:#A3C25E; --c-casa:#97A29E;
  --ok:#5BBF93; --warn:#D7A55C; --crit:#E0786D; --on-sec:#0E1412;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%}
h1,h2,h3{font-family:var(--display); font-weight:700; margin:0; text-wrap:balance; letter-spacing:-.01em}
button{font:inherit; color:inherit}
input,textarea,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
[hidden]{display:none !important}

/* ---------- color por sección ---------- */
.shell[data-sec="hoy"]{--sec:#BE853B}
.shell[data-sec="agenda"]{--sec:var(--c-trabajo)}
.shell[data-sec="entreno"]{--sec:var(--c-entreno)}
.shell[data-sec="comida"]{--sec:var(--c-comida)}
.shell[data-sec="banda"]{--sec:var(--c-ensayo)}
.shell[data-sec="estudio"]{--sec:#6E5B9E}
.shell[data-sec="datos"]{--sec:var(--accent)}

.shell{max-width:1040px; margin:0 auto; padding-inline:16px; padding-block:0 96px}
header.top{
  position:sticky; top:0; z-index:20; background:var(--bg);
  padding-block:14px 10px; border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.brand h1{font-size:20px}
.brand .sub{color:var(--ink3); font-size:12.5px; letter-spacing:.06em; text-transform:uppercase}
.brand .sp{flex:1}
.weekbar{display:flex; align-items:center; gap:8px; margin-top:10px}
.weekbar .label{flex:1; min-width:0; font-family:var(--display); font-weight:500; font-size:14.5px}
.weekbar .label small{display:block; color:var(--ink3); font-family:var(--body); font-weight:400; font-size:12px}
.iconbtn{
  display:grid; place-items:center; width:34px; height:34px; flex:0 0 auto;
  background:var(--surface); border:1px solid var(--line); border-radius:10px; cursor:pointer;
}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.pill{
  border:1px solid var(--line); background:var(--surface); border-radius:999px;
  padding:5px 11px; font-size:12.5px; cursor:pointer;
}
.pill[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}

nav.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:grid; grid-template-columns:repeat(6,1fr);
  background:var(--surface); border-top:1px solid var(--line);
  padding:6px max(6px, env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom));
}
nav.tabs button{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:0; padding:6px 2px; cursor:pointer; color:var(--ink2);
  border-radius:10px; font-size:10.5px;
}
nav.tabs button svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
nav.tabs button[aria-current="true"]{color:var(--sec); background:var(--surface2)}
@supports (color: color-mix(in srgb, red, blue)){
  nav.tabs button[aria-current="true"]{background:color-mix(in srgb, var(--sec) 15%, transparent)}
}

.stack{display:flex; flex-direction:column; gap:14px; margin-top:16px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card>.head{display:flex; align-items:center; gap:10px; padding:13px 15px 0}
.card>.head h2{font-size:15.5px; flex:1; min-width:0}
.card>.body{padding:12px 15px 15px}
.eyebrow{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink3)}
.card>.head .eyebrow{color:var(--sec); font-weight:500}
.muted{color:var(--ink2)}
.small{font-size:13.5px}
.empty{padding:18px 15px; color:var(--ink2); font-size:14px}
.note{
  border-left:3px solid var(--warn); background:var(--surface2);
  padding:10px 12px; border-radius:0 10px 10px 0; font-size:13.5px; color:var(--ink2);
}
/* ---------- banners con paisaje ---------- */
.banner{
  position:relative; border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow);
  min-height:132px; display:flex; align-items:flex-end;
  background:var(--surface2) center 62% / cover no-repeat;
}
.banner.tall{min-height:214px}
.banner::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(10,16,14,0) 34%, rgba(10,16,14,.26) 62%, rgba(10,16,14,.70) 100%);
}
.banner .inner{position:relative; z-index:1; padding:16px 16px 15px; width:100%; color:#F4F6F3}
.banner .eyebrow{color:rgba(244,246,243,.8)}
.banner h2{font-size:20px; color:#fff; text-shadow:0 2px 14px rgba(0,0,0,.4)}
.banner .day{
  font-family:var(--display); font-weight:700; font-size:31px; line-height:1.05;
  text-transform:capitalize; color:#fff; text-shadow:0 2px 16px rgba(0,0,0,.45);
}
.banner .date{color:rgba(244,246,243,.85); font-size:13px; margin-top:2px}
.banner .sub{font-size:13px; color:rgba(244,246,243,.85); margin-top:3px}
.banner .chip{border-color:rgba(255,255,255,.34); background:rgba(10,18,15,.34); color:rgba(255,255,255,.94)}
.banner .chip b{color:#fff}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:12px; border:1px solid var(--line); border-radius:999px; padding:4px 10px; color:var(--ink2)}
.chip b{font-family:var(--mono); font-weight:500; color:var(--ink)}
.dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto; box-shadow:0 0 0 2px rgba(255,255,255,.22)}

ul.blocks{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
ul.blocks li{display:flex; gap:11px; padding:9px 0; border-top:1px solid var(--line)}
ul.blocks li:first-child{border-top:0}
ul.blocks li.now{background:var(--surface2); margin-inline:-15px; padding-inline:15px; border-radius:10px; border-top-color:transparent}
ul.blocks li.done .title{text-decoration:line-through; color:var(--ink3)}
ul.blocks li.done .stripe{opacity:.35}
@supports (color: color-mix(in srgb, red, blue)){
  ul.blocks li.now{background:color-mix(in srgb, var(--sec) 13%, transparent)}
}
.time{font-family:var(--mono); font-size:12.5px; color:var(--ink2); width:44px; flex:0 0 auto; padding-top:1px}
.time span{display:block; color:var(--ink3)}
.stripe{width:4px; border-radius:3px; flex:0 0 auto; align-self:stretch}
.bmain{flex:1; min-width:0}
.bmain .title{font-weight:500; font-size:14.5px; overflow-wrap:anywhere}
.bmain .meta{font-size:12px; color:var(--ink3); margin-top:1px}
.tick{
  width:24px; height:24px; flex:0 0 auto; align-self:center; cursor:pointer;
  border:1px solid var(--line); border-radius:7px; background:var(--surface2);
  display:grid; place-items:center; padding:0;
}
.tick svg{width:14px; height:14px; stroke:var(--sec); fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; opacity:0}
.tick[aria-pressed="true"]{background:var(--surface2); border-color:var(--sec)}
@supports (color: color-mix(in srgb, red, blue)){
  .tick[aria-pressed="true"]{background:color-mix(in srgb, var(--sec) 18%, transparent)}
}
.tick[aria-pressed="true"] svg{opacity:1}
.del{
  width:24px; height:24px; flex:0 0 auto; align-self:center; cursor:pointer; padding:0;
  border:1px solid var(--line); border-radius:7px; background:var(--surface2); color:var(--crit);
  display:grid; place-items:center; font-size:14px; line-height:1;
}
.del:hover{border-color:var(--crit)}

.grid2{display:grid; gap:14px}
@media (min-width:760px){ .grid2{grid-template-columns:1fr 1fr} }

table.sets{width:100%; border-collapse:collapse; margin-top:6px}
table.sets th{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3); font-weight:500; text-align:left; padding:0 6px 4px 0}
table.sets td{padding:3px 6px 3px 0; border:0}
table.sets td:first-child{width:26px; color:var(--ink3); font-family:var(--mono); font-size:12px}
table.sets input{
  width:100%; min-width:0; text-align:center; padding:6px 2px;
  background:var(--surface2); border:1px solid var(--line); border-radius:8px;
  font-family:var(--mono); font-size:13.5px;
}
table.sets input:hover{border-color:var(--ink3)}
.ex{padding:11px 0; border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex h3{font-size:14px; font-weight:600; font-family:var(--body)}
.ex .obj{font-size:12px; color:var(--ink3); font-family:var(--mono)}
textarea.feel{
  width:100%; margin-top:10px; min-height:62px; resize:vertical;
  background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-size:13.5px;
}
.btn{border:1px solid var(--line); background:var(--surface2); border-radius:11px; padding:9px 13px; font-size:13.5px; cursor:pointer}
.btn:hover{border-color:var(--sec)}
.btn.primary{background:var(--sec); border-color:var(--sec); color:var(--on-sec); font-weight:500}
.btn.primary[aria-pressed="true"]{background:var(--surface2); color:var(--ink); border-color:var(--sec)}
.pill[aria-pressed="true"]{background:var(--sec); border-color:var(--sec); color:var(--on-sec)}
.btn.danger{color:var(--crit)}
.btn.danger:hover{border-color:var(--crit)}
.btnrow{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}

.meals{list-style:none; margin:0; padding:0}
.meals li{display:flex; gap:10px; padding:7px 0; border-top:1px solid var(--line); font-size:13.5px}
.meals li:first-child{border-top:0}
.meals .k{width:82px; flex:0 0 auto; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); padding-top:2px}
.shop{list-style:none; margin:0; padding:0}
.shop li{display:flex; align-items:center; gap:10px; padding:6px 0; border-top:1px solid var(--line); font-size:13.5px}
.shop li:first-child{border-top:0}
.shop li.on .n{text-decoration:line-through; color:var(--ink3)}
.shop .n{flex:1; min-width:0}
.shop .q{font-family:var(--mono); font-size:12px; color:var(--ink3)}
.meter{height:7px; border-radius:99px; background:var(--surface2); overflow:hidden; margin-top:8px}
.meter i{display:block; height:100%; background:var(--sec)}
.meter.over i{background:var(--crit)}

.items{list-style:none; margin:0; padding:0}
.items li{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line)}
.items li:first-child{border-top:0}
.items .t{flex:1; min-width:0; font-size:14px}
.items .t small{display:block; color:var(--ink3); font-size:11.5px; font-family:var(--mono)}
.state{border:1px solid var(--line); background:var(--surface2); border-radius:999px; padding:4px 10px; font-size:11.5px; cursor:pointer; white-space:nowrap}
.state[data-s="escuchando"]{border-color:var(--warn); color:var(--warn)}
.state[data-s="hecho"]{border-color:var(--ok); color:var(--ok)}
.addrow{display:flex; gap:8px; margin-top:12px}
.addrow input{flex:1; min-width:0; background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:13.5px}
.bars{display:flex; flex-direction:column; gap:7px; margin-top:4px}
.bar{display:flex; align-items:center; gap:9px; font-size:12.5px}
.bar .nm{width:74px; flex:0 0 auto; color:var(--ink2)}
.bar .tr{flex:1; height:9px; background:var(--surface2); border-radius:99px; overflow:hidden}
.bar .tr i{display:block; height:100%}
.bar .v{font-family:var(--mono); font-size:12px; color:var(--ink2); width:42px; text-align:right}
.hint{font-size:12.5px; color:var(--ink3); margin-top:10px}

form.newblock{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:10px}
form.newblock input,form.newblock select{
  background:var(--surface2); border:1px solid var(--line); border-radius:9px; padding:8px 9px; font-size:13.5px; min-width:0;
}
form.newblock .wide{grid-column:1/-1}
.kv{list-style:none; margin:0; padding:0}
.kv li{display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-top:1px solid var(--line); font-size:13.5px}
.kv li:first-child{border-top:0}
.kv .v{font-family:var(--mono); color:var(--ink2)}

/* ---------- apartados nuevos ---------- */
.subtabs{display:flex; gap:8px; flex-wrap:wrap}
.formgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-top:4px}
.formgrid label{display:flex; flex-direction:column; gap:4px; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); min-width:0}
.formgrid input,.formgrid textarea{
  background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:9px 10px;
  font-size:14px; font-family:var(--mono); min-width:0; width:100%;
}
.formgrid textarea{font-family:var(--body); resize:vertical; min-height:54px}
.formgrid .wide{grid-column:1/-1}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.stat{background:var(--surface2); border-radius:12px; padding:11px 12px; min-width:0}
.stat .k{font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink3)}
.stat .v{font-family:var(--mono); font-size:20px; font-weight:500; margin-top:3px; line-height:1.15}
.stat .d{font-size:11.5px; color:var(--ink3); font-family:var(--mono)}
figure.chart{margin:0; padding-top:6px}
figure.chart figcaption{font-size:12px; color:var(--ink3); margin-bottom:4px}
figure.chart svg{display:block; width:100%; height:auto; overflow:visible}
figure.chart .gl{stroke:var(--line); stroke-width:1}
figure.chart .ln{fill:none; stroke:var(--sec); stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
figure.chart .pt{fill:var(--sec); stroke:var(--surface); stroke-width:2}
figure.chart .lbl{font-family:var(--mono); font-size:10.5px; fill:var(--ink2)}
figure.chart .ax{font-family:var(--mono); font-size:10px; fill:var(--ink3)}
.tablewrap{overflow-x:auto; margin-top:4px}
table.data{width:100%; border-collapse:collapse; font-size:13px}
table.data th{
  text-align:left; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--ink3); font-weight:500; padding:0 10px 6px 0; white-space:nowrap;
}
table.data td{padding:7px 10px 7px 0; border-top:1px solid var(--line); font-family:var(--mono); white-space:nowrap}
table.data td:first-child{font-family:var(--body)}
table.data td:last-child{padding-right:0; text-align:right}
details.item{border-top:1px solid var(--line)}
details.item:first-of-type{border-top:0}
details.item>summary{list-style:none; cursor:pointer; padding:10px 0; display:flex; align-items:center; gap:10px}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary::after{content:"+"; color:var(--ink3); margin-left:auto; font-size:16px; line-height:1}
details.item[open]>summary::after{content:"–"}
details.item .nm{flex:1; min-width:0; font-size:14px; font-weight:500; overflow-wrap:anywhere}
details.item .nm small{display:block; font-weight:400; color:var(--ink3); font-size:11.5px; font-family:var(--mono)}
details.item .box{padding:0 0 12px}
details.item textarea{
  width:100%; min-height:68px; resize:vertical; background:var(--surface2);
  border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-size:13.5px;
}
details.item .acts{display:flex; gap:8px; margin-top:8px; align-items:center; flex-wrap:wrap}
.porque{font-size:13px; color:var(--ink2); margin:0 0 8px}
@media (min-width:560px){ .formgrid{grid-template-columns:repeat(3,1fr)} }

.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:82px; z-index:50;
  background:var(--ink); color:var(--bg); padding:9px 15px; border-radius:999px; font-size:13px;
  max-width:calc(100% - 32px); text-align:center;
  opacity:0; pointer-events:none; transition:opacity .18s ease;
}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }

@media (min-width:900px){
  .shell{display:grid; grid-template-columns:196px 1fr; gap:26px; padding-block:0 40px; align-items:start}
  header.top{grid-column:1/-1}
  nav.tabs{
    position:sticky; top:104px; bottom:auto; grid-template-columns:1fr; gap:2px;
    border:1px solid var(--line); border-radius:var(--r); padding:8px; box-shadow:var(--shadow);
  }
  nav.tabs button{flex-direction:row; gap:10px; justify-content:flex-start; font-size:13.5px; padding:9px 10px}
  main{min-width:0}
  .stack{margin-top:0; padding-top:16px}
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <h1>Agenda personal</h1>
      <span class="sub">Ronda · Antequera · Arriate</span>
      <span class="sp"></span>
      <button class="iconbtn" id="themebtn" title="Cambiar entre claro y oscuro" aria-label="Cambiar entre claro y oscuro"></button>
      <button class="iconbtn" id="datosbtn" aria-pressed="false" title="Datos y copias" aria-label="Datos y copias">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5c0-1.4 3.6-2.5 8-2.5s8 1.1 8 2.5S16.4 10 12 10 4 8.9 4 7.5z"/><path d="M4 7.5v9c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5v-9"/><path d="M4 12c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5"/></svg>
      </button>
    </div>
    <div class="weekbar">
      <button class="iconbtn" id="prevw" title="Semana anterior" aria-label="Semana anterior">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="label" id="weeklabel">—<small></small></div>
      <button class="pill" id="thisw">Hoy</button>
      <button class="iconbtn" id="nextw" title="Semana siguiente" aria-label="Semana siguiente">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
  <main id="view"></main>
</div>
<input type="file" id="importfile" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  /* ============ constantes ============ */
  var KEY = 'semana-serrana.v1';
  var ICONS = {
    hoy:'<path d="M12 3v3m0 12v3m9-9h-3M6 12H3m14.6-6.6l-2.1 2.1M8.5 15.5l-2.1 2.1m0-11.2l2.1 2.1m7 7l2.1 2.1"/><circle cx="12" cy="12" r="3.4"/>',
    agenda:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3.5V6m8-2.5V6"/>',
    entreno:'<path d="M6.5 9v6m11-6v6M4 10.5v3m16-3v3M6.5 12h11"/>',
    comida:'<path d="M7 3.5v7a2.5 2.5 0 005 0v-7M9.5 13v7.5M16 3.5c-1.4 1.2-2 3-2 5s.7 2.8 2 3v9"/>',
    banda:'<circle cx="8" cy="17.5" r="2.6"/><circle cx="18" cy="15.5" r="2.6"/><path d="M10.6 17.5V7l10-2v10.5"/>',
    estudio:'<path d="M4 5.5h6a2.5 2.5 0 012.5 2.5v11A2 2 0 0010.5 17H4zM20 5.5h-6A2.5 2.5 0 0011.5 8v11A2 2 0 0113.5 17H20z"/>'
  };
  var TABS = [
    {k:'hoy', n:'Hoy'}, {k:'agenda', n:'Agenda'}, {k:'entreno', n:'Entreno'},
    {k:'comida', n:'Comida'}, {k:'banda', n:'Banda'}, {k:'estudio', n:'Estudio'}
  ];
  var CATS = {
    trabajo:{n:'Trabajo', c:'var(--c-trabajo)'},
    trayecto:{n:'Trayecto', c:'var(--c-trayecto)'},
    ensayo:{n:'Ensayo', c:'var(--c-ensayo)'},
    entreno:{n:'Entreno', c:'var(--c-entreno)'},
    estudio:{n:'Estudio', c:'var(--c-estudio)'},
    comida:{n:'Comida', c:'var(--c-comida)'},
    casa:{n:'Casa', c:'var(--c-casa)'}
  };
  var MEALS = [['desayuno','Desayuno'],['media','Media mañana'],['almuerzo','Almuerzo'],['merienda','Merienda'],['cena','Cena']];
  var DAYNAMES = ['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
  var MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  /* ============ almacenamiento local ============ */
  function base(){
    return {meta:{app:'semana-serrana', version:1}, semanas:{}, estudio:{items:[]},
            medidas:{registros:[]}, repertorio:{marchas:[]}, config:{}};
  }
  var store = base(), storageOk = true;

  function loadStore(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var p = JSON.parse(raw);
        if(p && typeof p === 'object'){
          store = {
            meta: p.meta || {app:'semana-serrana', version:1},
            semanas: p.semanas || {},
            estudio: p.estudio || {items:[]},
            medidas: p.medidas || {registros:[]},
            repertorio: p.repertorio || {marchas:[]},
            config: p.config || {}
          };
        }
      }
    }catch(e){ storageOk = false }
  }
  function persist(){
    try{
      store.meta.guardado = new Date().toISOString();
      localStorage.setItem(KEY, JSON.stringify(store));
    }catch(e){
      storageOk = false;
      toast('Este navegador no deja guardar datos (modo privado o almacenamiento lleno)');
    }
  }

  var state = {tab:'hoy', sub:'menu', subEntreno:'semana', edit:false, monday:mondayOf(new Date())};

  /* ============ fechas ============ */
  function pad(n){ return n<10 ? '0'+n : ''+n }
  function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()) }
  function mondayOf(d){
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var w = (x.getDay()+6)%7; x.setDate(x.getDate()-w); return x;
  }
  function addDays(d,n){ var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x }
  function weekDates(){ var a=[]; for(var i=0;i<7;i++) a.push(addDays(state.monday,i)); return a }
  function longDate(d){ return d.getDate()+' de '+MONTHS[d.getMonth()] }
  function mins(t){ if(!t) return 0; var p=String(t).split(':'); return (+p[0])*60 + (+(p[1]||0)) }
  function dur(a,b){ var d=mins(b)-mins(a); return d<0 ? d+1440 : d }
  function hrs(m){
    if(m < 60) return m + ' min';
    var h=Math.floor(m/60), r=m%60;
    return r ? h+'h '+pad(r) : h+'h';
  }
  function wid(){ return iso(state.monday) }
  function isCurrentWeek(){ return iso(mondayOf(new Date())) === wid() }
  function validTime(t){ return /^([01]?\d|2[0-3]):[0-5]\d$/.test(t) }

  /* ============ acceso a datos ============ */
  function week(){ return store.semanas[wid()] || null }
  function d(key){ var w = week(); return (w && w[key]) || null }
  function save(key, data){
    if(!store.semanas[wid()]) store.semanas[wid()] = {};
    store.semanas[wid()][key] = data;
    persist();
  }
  function saveEstudio(data){ store.estudio = data; persist() }
  function medidas(){ return (store.medidas && store.medidas.registros) || [] }
  function saveMedidas(regs){ store.medidas = {registros:regs}; persist() }
  function marchas(){ return (store.repertorio && store.repertorio.marchas) || [] }
  function saveMarchas(ms){ store.repertorio = {marchas:ms}; persist() }
  function num(v){ var n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null }
  function fmt(n, dec){ return n == null ? '—' : n.toFixed(dec == null ? 1 : dec).replace('.', ',') }
  function delta(a, b, dec){
    if(a == null || b == null) return '';
    var v = a - b;
    if(Math.abs(v) < 0.05) return ' · igual';
    return ' · ' + (v > 0 ? '+' : '−') + fmt(Math.abs(v), dec);
  }
  function clone(o){ return JSON.parse(JSON.stringify(o)) }
  function uid(){ return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,6) }

  /* ============ utilidades DOM ============ */
  function h(html){ var t=document.createElement('div'); t.innerHTML=html; return t }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }) }
  function card(title, eyebrow){
    var c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = (title ? '<div class="head"><h2>'+esc(title)+'</h2>'+(eyebrow?'<span class="eyebrow">'+esc(eyebrow)+'</span>':'')+'</div>' : '')+'<div class="body"></div>';
    c.body = c.querySelector('.body');
    return c;
  }
  function stack(){ var s=document.createElement('div'); s.className='stack'; return s }
  function banner(o){
    var el = document.createElement('div');
    el.className = 'banner' + (o.tall ? ' tall' : '');
    el.style.backgroundImage = 'url("img/' + o.img + '.webp")';
    el.setAttribute('role','img');
    el.setAttribute('aria-label', o.alt || 'Paisaje de la serranía de Ronda');
    el.innerHTML = '<div class="inner">' +
      (o.eyebrow ? '<div class="eyebrow">'+esc(o.eyebrow)+'</div>' : '') +
      (o.day ? '<div class="day">'+esc(o.day)+'</div>' : '') +
      (o.title ? '<h2>'+esc(o.title)+'</h2>' : '') +
      (o.date ? '<div class="date">'+esc(o.date)+'</div>' : '') +
      (o.sub ? '<div class="sub">'+esc(o.sub)+'</div>' : '') +
      (o.chips ? '<div class="chips">'+o.chips+'</div>' : '') +
      '</div>';
    return el;
  }
  function imagenDelDia(){
    if(!isCurrentWeek()) return 'hoy';
    var hh = new Date().getHours();
    if(hh < 11) return 'hoy';
    if(hh < 18) return 'agenda';
    if(hh < 21) return 'entreno';
    return 'banda';
  }
  function altDelDia(){
    return ({hoy:'Amanecer sobre la serranía', agenda:'La serranía a mediodía',
             entreno:'Atardecer sobre la serranía', banda:'La serranía de noche'})[imagenDelDia()];
  }
  function emptyCard(msg){
    var c = document.createElement('div'); c.className='card';
    c.innerHTML = '<div class="empty">'+msg+'</div>'; return c;
  }
  var tTimer;
  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(tTimer); tTimer = setTimeout(function(){ el.classList.remove('show') }, 3000);
  }

  /* ============ render ============ */
  function render(){
    renderTabs();
    var ds = weekDates(), first = ds[0], last = ds[6];
    var same = first.getMonth() === last.getMonth();
    document.getElementById('weeklabel').innerHTML =
      'Semana del ' + first.getDate() + (same ? '' : ' de ' + MONTHS[first.getMonth()]) +
      ' al ' + last.getDate() + ' de ' + MONTHS[last.getMonth()] +
      '<small>' + (isCurrentWeek() ? 'semana en curso' : (state.monday > new Date() ? 'próxima' : 'pasada')) + '</small>';
    document.getElementById('datosbtn').setAttribute('aria-pressed', state.tab === 'datos' ? 'true':'false');
    document.querySelector('.shell').dataset.sec = state.tab;
    var views = {hoy:viewHoy, agenda:viewAgenda, entreno:viewEntreno, comida:viewComida, banda:viewBanda, estudio:viewEstudio, datos:viewDatos};
    var v = document.getElementById('view');
    v.innerHTML = '';
    v.appendChild(views[state.tab]());
  }
  function go(tab){ state.tab = tab; render(); window.scrollTo({top:0}) }
  function renderTabs(){
    var nav = document.getElementById('tabs');
    if(nav.childNodes.length){
      Array.prototype.forEach.call(nav.children, function(b){
        b.setAttribute('aria-current', b.dataset.k === state.tab ? 'true' : 'false');
      });
      return;
    }
    TABS.forEach(function(t){
      var b = document.createElement('button');
      b.dataset.k = t.k;
      b.setAttribute('aria-current', t.k === state.tab ? 'true':'false');
      b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[t.k]+'</svg><span>'+t.n+'</span>';
      b.addEventListener('click', function(){ go(t.k) });
      nav.appendChild(b);
    });
  }

  function blocksOf(dayIso){
    var ag = d('agenda');
    if(!ag || !ag.dias) return [];
    var day = ag.dias.filter(function(x){ return x.fecha === dayIso })[0];
    var bs = (day && day.bloques) ? day.bloques.slice() : [];
    bs.sort(function(a,b){ return mins(a.ini) - mins(b.ini) });
    return bs;
  }
  function mutateAgenda(fn){
    var ag = clone(d('agenda') || {dias:[]});
    if(!ag.dias) ag.dias = [];
    fn(ag);
    save('agenda', ag);
  }
  function dayEntry(ag, dayIso){
    var e = ag.dias.filter(function(x){ return x.fecha === dayIso })[0];
    if(!e){ e = {fecha:dayIso, bloques:[]}; ag.dias.push(e) }
    if(!e.bloques) e.bloques = [];
    return e;
  }

  function blockList(dayIso, opts){
    opts = opts || {};
    var bs = blocksOf(dayIso);
    var ul = document.createElement('ul');
    ul.className = 'blocks';
    if(!bs.length){
      var li = document.createElement('li');
      li.innerHTML = '<span class="muted small">Sin bloques para este día.</span>';
      ul.appendChild(li);
      return ul;
    }
    var now = new Date(), nowM = now.getHours()*60 + now.getMinutes(), today = iso(now);
    bs.forEach(function(b){
      var cat = CATS[b.cat] || CATS.casa;
      var isNow = opts.markNow && dayIso === today && mins(b.ini) <= nowM && nowM < mins(b.ini) + dur(b.ini, b.fin);
      var li = document.createElement('li');
      li.className = (b.hecho ? 'done ' : '') + (isNow ? 'now' : '');
      li.innerHTML =
        '<div class="time mono">'+esc(b.ini)+'<span>'+esc(b.fin)+'</span></div>'+
        '<div class="stripe" style="background:'+cat.c+'"></div>'+
        '<div class="bmain"><div class="title">'+esc(b.titulo)+'</div>'+
        '<div class="meta">'+esc(cat.n)+' · '+hrs(dur(b.ini,b.fin))+(b.nota ? ' · '+esc(b.nota) : '')+(isNow?' · ahora':'')+'</div></div>'+
        (state.edit && opts.editable
          ? '<button class="del" aria-label="Borrar bloque">&times;</button>'
          : '<button class="tick" aria-pressed="'+(b.hecho?'true':'false')+'" aria-label="Marcar hecho"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4.5 4.5L19 7"/></svg></button>');
      var tick = li.querySelector('.tick');
      if(tick) tick.addEventListener('click', function(){
        mutateAgenda(function(ag){
          dayEntry(ag, dayIso).bloques.forEach(function(x){ if(x.id === b.id) x.hecho = !x.hecho });
        });
        render();
      });
      var del = li.querySelector('.del');
      if(del) del.addEventListener('click', function(){
        mutateAgenda(function(ag){
          var e = dayEntry(ag, dayIso);
          e.bloques = e.bloques.filter(function(x){ return x.id !== b.id });
        });
        render();
      });
      ul.appendChild(li);
    });
    return ul;
  }

  function newBlockForm(dayIso){
    var f = document.createElement('form');
    f.className = 'newblock';
    var opts = Object.keys(CATS).map(function(k){ return '<option value="'+k+'">'+CATS[k].n+'</option>' }).join('');
    f.innerHTML =
      '<input class="wide" name="titulo" placeholder="Qué es" aria-label="Título del bloque" required>'+
      '<input name="ini" placeholder="Desde 07:00" aria-label="Hora de inicio" inputmode="numeric" required>'+
      '<input name="fin" placeholder="Hasta 08:30" aria-label="Hora de fin" inputmode="numeric" required>'+
      '<select name="cat" aria-label="Categoría">'+opts+'</select>'+
      '<button class="btn primary" type="submit">Añadir bloque</button>';
    f.addEventListener('submit', function(ev){
      ev.preventDefault();
      var t = f.titulo.value.trim(), a = f.ini.value.trim(), b = f.fin.value.trim();
      if(!t){ toast('Ponle un título al bloque'); return }
      if(!validTime(a) || !validTime(b)){ toast('Las horas van en formato 21:00'); return }
      mutateAgenda(function(ag){
        dayEntry(ag, dayIso).bloques.push({id:uid(), ini:a, fin:b, cat:f.cat.value, titulo:t, hecho:false});
      });
      f.reset();
      render();
    });
    return f;
  }

  /* ============ HOY ============ */
  function viewHoy(){
    var s = stack();
    var now = new Date();
    var target = isCurrentWeek() ? now : state.monday;
    var dayIso = iso(target);
    var bs = blocksOf(dayIso);

    var totals = {};
    bs.forEach(function(b){ totals[b.cat] = (totals[b.cat]||0) + dur(b.ini,b.fin) });
    var chips = Object.keys(totals).map(function(k){
      var cat = CATS[k] || CATS.casa;
      return '<span class="chip"><i class="dot" style="background:'+cat.c+'"></i>'+esc(cat.n)+' <b>'+hrs(totals[k])+'</b></span>';
    }).join('');
    s.appendChild(banner({
      img: imagenDelDia(), alt: altDelDia(), tall: true,
      eyebrow: isCurrentWeek() ? 'Hoy' : 'Primer día de la semana',
      day: DAYNAMES[(target.getDay()+6)%7],
      date: longDate(target) + ' de ' + target.getFullYear(),
      chips: chips || '<span class="chip">Día sin bloques</span>'
    }));

    var c1 = card('El día, por bloques');
    c1.body.appendChild(blockList(dayIso, {markNow:true}));
    s.appendChild(c1);

    var g = document.createElement('div'); g.className = 'grid2';

    var mn = d('menu');
    var c2 = card('Comidas de hoy', 'Comida');
    var day = mn && mn.dias ? mn.dias.filter(function(x){ return x.fecha === dayIso })[0] : null;
    if(day && day.comidas){
      var ul = document.createElement('ul'); ul.className = 'meals';
      MEALS.forEach(function(m){
        if(!day.comidas[m[0]]) return;
        var li = document.createElement('li');
        li.innerHTML = '<span class="k">'+m[1]+'</span><span>'+esc(day.comidas[m[0]])+'</span>';
        ul.appendChild(li);
      });
      c2.body.appendChild(ul);
    } else {
      c2.body.innerHTML = '<div class="muted small">Sin menú para este día. El menú de la semana se prepara el lunes.</div>';
    }
    g.appendChild(c2);

    var en = d('entreno');
    var c3 = card('Entreno de hoy', 'Entreno');
    var ses = en && en.sesiones ? en.sesiones.filter(function(x){ return x.fecha === dayIso })[0] : null;
    if(ses){
      c3.body.innerHTML = '<div style="font-weight:600; font-size:15px">'+esc(ses.nombre)+'</div>'+
        '<div class="muted small" style="margin-top:2px">'+(ses.ejercicios||[]).length+' ejercicios'+
        (ses.duracion?' · '+esc(ses.duracion)+' min':'')+(ses.hecho?' · hecha':'')+'</div>';
      var b = document.createElement('button');
      b.className = 'btn primary'; b.style.marginTop = '12px'; b.textContent = 'Registrar series';
      b.addEventListener('click', function(){ go('entreno') });
      c3.body.appendChild(b);
    } else {
      c3.body.innerHTML = '<div class="muted small">Hoy no toca entreno.</div>';
    }
    g.appendChild(c3);
    s.appendChild(g);
    return s;
  }

  /* ============ AGENDA ============ */
  function viewAgenda(){
    var s = stack();
    var totals = {}, grand = 0;
    weekDates().forEach(function(dt){
      blocksOf(iso(dt)).forEach(function(b){
        var m = dur(b.ini,b.fin); totals[b.cat] = (totals[b.cat]||0)+m; grand += m;
      });
    });
    var libres = Math.max(0, 7*16*60 - grand);
    s.appendChild(banner({
      img:'agenda', alt:'La serranía a mediodía', title:'La semana entera',
      eyebrow:'Agenda',
      sub: grand ? hrs(grand)+' comprometidas · unas '+hrs(libres)+' de margen despierto' : 'Todavía sin bloques'
    }));

    var c0 = card('Reparto de la semana', grand ? hrs(grand)+' ocupadas' : 'vacía');
    var ed = document.createElement('button');
    ed.className = 'pill'; ed.textContent = state.edit ? 'Listo' : 'Editar';
    ed.setAttribute('aria-pressed', state.edit ? 'true':'false');
    ed.addEventListener('click', function(){ state.edit = !state.edit; render() });
    c0.querySelector('.head').appendChild(ed);
    if(grand){
      var bars = document.createElement('div'); bars.className='bars';
      Object.keys(CATS).forEach(function(k){
        if(!totals[k]) return;
        var pc = Math.round(totals[k]/grand*100);
        var row = document.createElement('div'); row.className='bar';
        row.innerHTML = '<span class="nm">'+CATS[k].n+'</span>'+
          '<span class="tr"><i style="width:'+pc+'%; background:'+CATS[k].c+'"></i></span>'+
          '<span class="v">'+hrs(totals[k])+'</span>';
        bars.appendChild(row);
      });
      c0.body.appendChild(bars);
    } else {
      c0.body.innerHTML = '<div class="muted small">Esta semana no tiene agenda todavía. Impórtala desde el botón de datos o añade bloques a mano con «Editar».</div>';
    }
    var ag = d('agenda');
    if(ag && ag.nota) c0.body.appendChild(h('<div class="note" style="margin-top:12px">'+esc(ag.nota)+'</div>').firstChild);
    s.appendChild(c0);

    var g = document.createElement('div'); g.className='grid2';
    var today = iso(new Date());
    weekDates().forEach(function(dt, i){
      var di = iso(dt);
      var c = card(DAYNAMES[i].charAt(0).toUpperCase()+DAYNAMES[i].slice(1), di === today ? 'hoy' : longDate(dt));
      c.body.appendChild(blockList(di, {markNow:true, editable:true}));
      if(state.edit) c.body.appendChild(newBlockForm(di));
      g.appendChild(c);
    });
    s.appendChild(g);
    return s;
  }

  /* ============ ENTRENO ============ */
  var CAMPOS_MEDIDA = [
    ['peso','Peso (kg)',1], ['grasa','% grasa',1], ['musculo','% músculo',1],
    ['cintura','Cintura (cm)',1], ['cadera','Cadera (cm)',1], ['pecho','Pecho (cm)',1],
    ['brazo','Brazo (cm)',1], ['muslo','Muslo (cm)',1], ['cuello','Cuello (cm)',1]
  ];

  function subtabs(opts, actual, onPick){
    var c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = '<div class="body subtabs"></div>';
    opts.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'pill'; b.textContent = o[1];
      b.setAttribute('aria-pressed', actual === o[0] ? 'true' : 'false');
      b.addEventListener('click', function(){ onPick(o[0]) });
      c.querySelector('.body').appendChild(b);
    });
    return c;
  }

  function viewEntreno(){
    var s = stack();
    var en = d('entreno');

      return s;

    if(en.nota) s.appendChild(h('<div class="card"><div class="body"><div class="note">'+esc(en.nota)+'</div></div></div>').firstChild);

    en.sesiones.forEach(function(ses, si){
      var dt = new Date(ses.fecha + 'T00:00:00');

        t.innerHTML = '<thead><tr><th></th><th>kg</th><th>reps</th><th>RPE</th></tr></thead>';
        var tb = document.createElement('tbody');
        (ex.series||[]).forEach(function(serie, ri){
          var tr = document.createElement('tr');
          tr.innerHTML = '<td>'+(ri+1)+'</td>';

      });
      c.body.appendChild(b);
      s.appendChild(c);
    });

  /* ---------- gráfica de una serie ---------- */
  function lineChart(puntos, titulo, unidad, dec){
    var W = 320, H = 110, L = 34, R = 12, T = 10, B = 20;
    var ys = puntos.map(function(p){ return p.y });
    var min = Math.min.apply(null, ys), max = Math.max.apply(null, ys);
    if(max - min < 0.6){ min -= 0.4; max += 0.4 }
    var pad = (max - min) * 0.12; min -= pad; max += pad;
    var px = function(i){ return L + (puntos.length === 1 ? (W-L-R)/2 : i * (W - L - R) / (puntos.length - 1)) };
    var py = function(v){ return T + (max - v) / (max - min) * (H - T - B) };
    var g = '';
    [max, (max+min)/2, min].forEach(function(v){
      g += '<line class="gl" x1="'+L+'" y1="'+py(v).toFixed(1)+'" x2="'+W+'" y2="'+py(v).toFixed(1)+'"/>'+
           '<text class="ax" x="0" y="'+(py(v)+3.5).toFixed(1)+'">'+fmt(v, dec)+'</text>';
    });
    var dpath = puntos.map(function(p,i){ return (i?'L':'M') + px(i).toFixed(1) + ' ' + py(p.y).toFixed(1) }).join(' ');
    var pts = puntos.map(function(p,i){
      return '<circle class="pt" cx="'+px(i).toFixed(1)+'" cy="'+py(p.y).toFixed(1)+'" r="4">'+
             '<title>'+esc(p.etiqueta)+': '+fmt(p.y, dec)+' '+esc(unidad)+'</title></circle>';
    }).join('');
    var ultimo = puntos[puntos.length-1];
    var lbl = '<text class="lbl" x="'+Math.min(px(puntos.length-1), W-26).toFixed(1)+'" y="'+(py(ultimo.y)-10).toFixed(1)+'" text-anchor="middle">'+fmt(ultimo.y, dec)+'</text>';
    var ejex = '<text class="ax" x="'+L+'" y="'+(H-4)+'">'+esc(puntos[0].etiqueta)+'</text>'+
               (puntos.length>1 ? '<text class="ax" x="'+W+'" y="'+(H-4)+'" text-anchor="end">'+esc(ultimo.etiqueta)+'</text>' : '');
    var f = document.createElement('figure');
    f.className = 'chart';
    f.innerHTML = '<figcaption>'+esc(titulo)+'</figcaption>'+
      '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(titulo)+', evolución de '+
      fmt(puntos[0].y,dec)+' a '+fmt(ultimo.y,dec)+' '+esc(unidad)+'">'+
      g + '<path class="ln" d="'+dpath+'"/>' + pts + lbl + ejex + '</svg>';
    return f;
  }

  function cortoFecha(f){
    var dt = new Date(f + 'T00:00:00');
    return dt.getDate() + ' ' + MONTHS[dt.getMonth()].slice(0,3);
  }

  /* ---------- ENTRENO · medidas ---------- */
  function vistaMedidas(s){
    var regs = medidas().slice().sort(function(a,b){ return a.fecha < b.fecha ? -1 : 1 });
    var ult = regs[regs.length-1], ant = regs[regs.length-2];

    var c0 = card('Última medición', ult ? cortoFecha(ult.fecha) : 'sin datos');
    if(ult){
      var st = document.createElement('div'); st.className = 'stats';
      [['peso','Peso','kg'],['grasa','% grasa',''],['musculo','% músculo','']].forEach(function(f){
        var v = num(ult[f[0]]), p = ant ? num(ant[f[0]]) : null;
        st.appendChild(h('<div class="stat"><div class="k">'+f[1]+'</div>'+
          '<div class="v">'+fmt(v)+(f[2]?' <span style="font-size:12px">'+f[2]+'</span>':'')+'</div>'+
          '<div class="d">'+(p!=null ? 'antes '+fmt(p)+delta(v,p) : 'primera')+'</div></div>').firstChild);
      });
      c0.body.appendChild(st);
      var otras = CAMPOS_MEDIDA.slice(3).filter(function(f){ return num(ult[f[0]]) != null });
      if(otras.length){
        var ul = document.createElement('ul'); ul.className = 'kv'; ul.style.marginTop = '12px';
        otras.forEach(function(f){
          var v = num(ult[f[0]]), p = ant ? num(ant[f[0]]) : null;
          ul.appendChild(h('<li><span>'+f[1]+'</span><span class="v">'+fmt(v)+(p!=null?delta(v,p):'')+'</span></li>').firstChild);
        });
        c0.body.appendChild(ul);
      }
      if(ult.notas) c0.body.appendChild(h('<div class="note" style="margin-top:12px">'+esc(ult.notas)+'</div>').firstChild);
    } else {
      c0.body.innerHTML = '<div class="muted small">Todavía no has apuntado ninguna medición. Rellena la de abajo y tendrás el punto de partida.</div>';
    }
    s.appendChild(c0);

    if(regs.length >= 2){
      var c1 = card('Evolución');
      [['peso','Peso corporal','kg'],['grasa','Grasa corporal','%'],['musculo','Masa muscular','%'],['cintura','Cintura','cm']].forEach(function(f){
        var ps = regs.filter(function(r){ return num(r[f[0]]) != null })
                     .map(function(r){ return {y:num(r[f[0]]), etiqueta:cortoFecha(r.fecha)} });
        if(ps.length >= 2) c1.body.appendChild(lineChart(ps, f[1]+' ('+f[2]+')', f[2], 1));
      });
      if(c1.body.childNodes.length) s.appendChild(c1);
    }

    var c2 = card('Apuntar medición');
    var form = document.createElement('form');
    form.className = 'formgrid';
    form.innerHTML = '<label class="wide">Fecha<input type="date" name="fecha" id="m-fecha" value="'+iso(new Date())+'" required></label>' +
      CAMPOS_MEDIDA.map(function(f){
        return '<label>'+f[1]+'<input type="text" inputmode="decimal" name="'+f[0]+'" id="m-'+f[0]+'" placeholder="—"></label>';
      }).join('') +
      '<label class="wide">Notas<textarea name="notas" id="m-notas" placeholder="Cómo te ves, hidratación, hora del día…"></textarea></label>' +
      '<div class="wide"><button class="btn primary" type="submit">Guardar medición</button></div>';
    form.addEventListener('submit', function(ev){
      ev.preventDefault();
      var r = {fecha: form.fecha.value || iso(new Date())};
      var algo = false;
      CAMPOS_MEDIDA.forEach(function(f){
        var v = form[f[0]].value.trim();
        if(v){ r[f[0]] = v; algo = true }
      });
      if(form.notas.value.trim()) r.notas = form.notas.value.trim();
      if(!algo){ toast('Rellena al menos un dato'); return }
      var ms = medidas().filter(function(x){ return x.fecha !== r.fecha });
      ms.push(r);
      ms.sort(function(a,b){ return a.fecha < b.fecha ? -1 : 1 });
      saveMedidas(ms);
      toast('Medición guardada');
      render();
    });
    c2.body.appendChild(form);
    c2.body.appendChild(h('<div class="hint">Mídete siempre igual: en ayunas, por la mañana y el mismo día de la semana. Si repites fecha, la nueva sustituye a la anterior.</div>').firstChild);
    s.appendChild(c2);

    if(regs.length){
      var c3 = card('Historial', regs.length + (regs.length===1?' medición':' mediciones'));
      var w = document.createElement('div'); w.className = 'tablewrap';
      var t = document.createElement('table'); t.className = 'data';
      t.innerHTML = '<thead><tr><th>Fecha</th><th>Peso</th><th>% grasa</th><th>% músc.</th><th>Cintura</th><th></th></tr></thead>';
      var tb = document.createElement('tbody');
      regs.slice().reverse().forEach(function(r){
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>'+cortoFecha(r.fecha)+'</td><td>'+fmt(num(r.peso))+'</td><td>'+fmt(num(r.grasa))+
          '</td><td>'+fmt(num(r.musculo))+'</td><td>'+fmt(num(r.cintura))+'</td>'+
          '<td><button class="del" aria-label="Borrar medición del '+esc(r.fecha)+'">&times;</button></td>';
        tr.querySelector('.del').addEventListener('click', function(){
          if(!window.confirm('¿Borrar la medición del '+cortoFecha(r.fecha)+'?')) return;
          saveMedidas(medidas().filter(function(x){ return x.fecha !== r.fecha }));
          render();
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb); w.appendChild(t); c3.body.appendChild(w);
      s.appendChild(c3);
    }
    return s;
  }

  /* ---------- ENTRENO · seguimiento mensual ---------- */
  function vistaMensual(s){
    var meses = {};
    function mes(k){
      if(!meses[k]) meses[k] = {sesiones:0, hechas:0, series:0, volumen:0, minutos:0, medidas:[]};
      return meses[k];
    }
    Object.keys(store.semanas || {}).forEach(function(wk){
      var en = store.semanas[wk].entreno;
      (en && en.sesiones || []).forEach(function(ses){
        var k = String(ses.fecha).slice(0,7);
        var m = mes(k);
        m.sesiones++;
        if(ses.hecho) m.hechas++;
        if(ses.hecho && ses.duracion) m.minutos += Number(ses.duracion) || 0;
        (ses.ejercicios||[]).forEach(function(ex){
          (ex.series||[]).forEach(function(serie){
            var kg = num(serie.kg), reps = num(serie.reps);
            if(reps != null){ m.series++; if(kg != null) m.volumen += kg * reps }
          });
        });
      });
    });
    medidas().forEach(function(r){ mes(String(r.fecha).slice(0,7)).medidas.push(r) });

    var keys = Object.keys(meses).sort().reverse();
    if(!keys.length){
      s.appendChild(emptyCard('Aún no hay nada que resumir. En cuanto marques sesiones como hechas y apuntes alguna medición, aquí verás mes a mes cuánto has entrenado y cómo han cambiado tus medidas.'));
      return s;
    }
    keys.forEach(function(k){
      var m = meses[k];
      var partes = k.split('-');
      var titulo = MONTHS[(+partes[1])-1].charAt(0).toUpperCase() + MONTHS[(+partes[1])-1].slice(1) + ' ' + partes[0];
      var c = card(titulo, m.hechas + ' de ' + m.sesiones + ' sesiones');
      var st = document.createElement('div'); st.className = 'stats';
      st.appendChild(h('<div class="stat"><div class="k">Sesiones hechas</div><div class="v">'+m.hechas+'</div>'+
        '<div class="d">de '+m.sesiones+' previstas</div></div>').firstChild);
      st.appendChild(h('<div class="stat"><div class="k">Series apuntadas</div><div class="v">'+m.series+'</div>'+
        '<div class="d">'+(m.minutos ? hrs(m.minutos)+' de gimnasio' : 'sin tiempo registrado')+'</div></div>').firstChild);
      st.appendChild(h('<div class="stat"><div class="k">Volumen</div><div class="v">'+
        (m.volumen ? Math.round(m.volumen).toLocaleString('es-ES') : '—')+'</div>'+
        '<div class="d">kg levantados</div></div>').firstChild);
      c.body.appendChild(st);

      if(m.medidas.length){
        var ms = m.medidas.slice().sort(function(a,b){ return a.fecha < b.fecha ? -1 : 1 });
        var pri = ms[0], ult = ms[ms.length-1];
        var ul = document.createElement('ul'); ul.className = 'kv'; ul.style.marginTop = '12px';
        [['peso','Peso'],['grasa','% grasa'],['musculo','% músculo'],['cintura','Cintura']].forEach(function(f){
          var a = num(pri[f[0]]), b = num(ult[f[0]]);
          if(a == null && b == null) return;
          var txt = ms.length > 1 && a != null && b != null
            ? fmt(a)+' → '+fmt(b)+delta(b, a)
            : fmt(b != null ? b : a);
          ul.appendChild(h('<li><span>'+f[1]+'</span><span class="v">'+txt+'</span></li>').firstChild);
        });
        if(ul.childNodes.length) c.body.appendChild(ul);
        c.body.appendChild(h('<div class="hint">'+ms.length+(ms.length===1?' medición este mes':' mediciones este mes')+'</div>').firstChild);
      } else {
        c.body.appendChild(h('<div class="hint">Sin mediciones este mes.</div>').firstChild);
      }
      s.appendChild(c);
    });
    return s;
  }

  /* ============ COMIDA ============ */
  function viewComida(){

              : 'El menú se prepara el lunes'

  /* ---------- COMIDA · lista de la compra ---------- */
  var EXTRAS = 'Añadido a mano';
  function guardaCompra(fn){
    var nx = clone(d('menu') || {dias:[], compra:{secciones:[], presupuesto:[60,80]}});
    if(!nx.compra) nx.compra = {secciones:[], presupuesto:[60,80]};
    if(!nx.compra.secciones) nx.compra.secciones = [];
    fn(nx.compra);
    save('menu', nx);
  }

  function vistaCompra(s, mn){
    var compra = (mn && mn.compra) || {secciones:[]};
    var secs = compra.secciones || [];
    var total = 0, done = 0;
    secs.forEach(function(sec){ (sec.items||[]).forEach(function(it){ total++; if(it.ok) done++ }) });

    var head = card('Compra en Mercadona', total ? done+' de '+total : 'lista vacía');
    var cost = compra.coste || 0, top = (compra.presupuesto && compra.presupuesto[1]) || 80;
    if(cost){
      var pc = Math.min(100, Math.round(cost/top*100));
      head.body.innerHTML = '<div style="display:flex; align-items:baseline; gap:8px">'+
        '<span class="mono" style="font-size:24px; font-weight:500">'+Number(cost).toFixed(0)+' €</span>'+
        '<span class="muted" style="font-size:13px">estimado · tope '+top+' €</span></div>'+
        '<div class="meter'+(cost>top?' over':'')+'"><i style="width:'+pc+'%"></i></div>'+
        '<div class="hint">Precios aproximados de webs que replican el catálogo de Mercadona; el ticket final puede variar.</div>';
    } else {
      head.body.innerHTML = '<div class="muted small">La lista de la compra de la semana llega con el menú del lunes. Mientras tanto, añade aquí lo que te vaya haciendo falta.</div>';
    }
    var addrow = document.createElement('div'); addrow.className = 'addrow';
    var inp = document.createElement('input');
    inp.id = 'newitem'; inp.placeholder = 'Añadir producto (ej.: café molido 250 g)';
    inp.setAttribute('aria-label', 'Nuevo producto');
    var add = document.createElement('button'); add.className = 'btn primary'; add.textContent = 'Añadir';
    function addItem(){
      var t = inp.value.trim(); if(!t) return;
      var cant = '';
      var m = t.match(/\s(\d[\d.,]*\s*(?:kg|g|l|ml|uds?|unidades?|paquetes?|latas?|botes?|bolsas?))$/i);
      if(m){ cant = m[1]; t = t.slice(0, m.index).trim() }
      guardaCompra(function(c){
        var sec = c.secciones.filter(function(x){ return x.nombre === EXTRAS })[0];
        if(!sec){ sec = {nombre:EXTRAS, items:[]}; c.secciones.push(sec) }
        sec.items.push({n:t, cant:cant, ok:false});
      });
      inp.value = '';
      render();
    }
    add.addEventListener('click', addItem);
    inp.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); addItem() } });
    addrow.appendChild(inp); addrow.appendChild(add);
    head.body.appendChild(addrow);
    if(done){
      var clr = document.createElement('button');
      clr.className = 'btn'; clr.style.marginTop = '8px'; clr.textContent = 'Desmarcar todo';
      clr.addEventListener('click', function(){
        guardaCompra(function(c){ c.secciones.forEach(function(sec){ (sec.items||[]).forEach(function(it){ it.ok = false }) }) });
        render();
      });
      head.body.appendChild(clr);
    }
    s.appendChild(head);

    if(!secs.length){
      s.appendChild(emptyCard('La lista está vacía. Escribe arriba lo que necesites y se irá guardando aquí.'));
      return s;
    }

    secs.forEach(function(sec, seci){
      var pend = (sec.items||[]).filter(function(it){ return !it.ok }).length;
      var c = card(sec.nombre, pend ? pend+' por coger' : 'completa');
      var ul = document.createElement('ul'); ul.className='shop';
      (sec.items||[]).forEach(function(it, ii){
        var li = document.createElement('li');
        if(it.ok) li.className='on';
        li.innerHTML = '<button class="tick" aria-pressed="'+(it.ok?'true':'false')+'" aria-label="Marcar comprado">'+
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4.5 4.5L19 7"/></svg></button>'+
          '<span class="n">'+esc(it.n)+'</span><span class="q">'+esc(it.cant||'')+'</span>'+
          '<button class="del" aria-label="Quitar de la lista">&times;</button>';
        li.querySelector('.tick').addEventListener('click', function(){
          guardaCompra(function(c){ c.secciones[seci].items[ii].ok = !c.secciones[seci].items[ii].ok });
          render();
        });
        li.querySelector('.del').addEventListener('click', function(){
          guardaCompra(function(c){
            c.secciones[seci].items.splice(ii, 1);
            if(!c.secciones[seci].items.length) c.secciones.splice(seci, 1);
          });
          render();
        });
        ul.appendChild(li);
      });
      c.body.appendChild(ul);
      s.appendChild(c);
    });
    return s;
  }

  /* ============ BANDA ============ */
  function viewBanda(){
    var s = stack();
    var bd = d('banda');
    var ens = (bd && bd.ensayos) || [];
    var minEns = ens.reduce(function(a,e){ return a + dur(e.ini,e.fin) }, 0);
    s.appendChild(banner({
      img:'banda', alt:'La serranía de noche', title:'Banda', eyebrow:'Arriate',
      sub: ens.length ? ens.length+' ensayos · '+hrs(minEns)+' de atril' : 'Ensayos por confirmar'
    }));
    var c = card('Ensayos de la semana', ens.length ? String(ens.length) : 'por confirmar');
    if(ens.length){
      var ul = document.createElement('ul'); ul.className='blocks';
      ens.forEach(function(e){
        var dt = new Date(e.fecha+'T00:00:00');
        var li = document.createElement('li');
        li.innerHTML = '<div class="time mono">'+esc(e.ini)+'<span>'+esc(e.fin)+'</span></div>'+
          '<div class="stripe" style="background:var(--c-ensayo)"></div>'+
          '<div class="bmain"><div class="title">'+DAYNAMES[(dt.getDay()+6)%7]+' · '+esc(e.lugar||'Arriate')+'</div>'+
          '<div class="meta">'+hrs(dur(e.ini,e.fin))+(e.nota?' · '+esc(e.nota):'')+'</div></div>';
        ul.appendChild(li);
      });
      c.body.appendChild(ul);
    } else {
      c.body.innerHTML = '<div class="muted small">Ningún ensayo cargado para esta semana.</div>';
    }
    if(bd && bd.nota) c.body.appendChild(h('<div class="note" style="margin-top:12px">'+esc(bd.nota)+'</div>').firstChild);
    s.appendChild(c);

    var c2 = card('Repaso en casa');
    var ta = document.createElement('textarea');
    ta.className='feel'; ta.id='bandnotes'; ta.style.marginTop='0';
    ta.placeholder='Qué repasar en casa esta semana: pasajes, tempo, dinámicas…';
    ta.value = (bd && bd.casa) || '';
    ta.addEventListener('change', function(){
      var nx = clone(bd || {});
      nx.casa = ta.value;
      save('banda', nx);
    });
    c2.body.appendChild(ta);
    s.appendChild(c2);

    /* --- repertorio, con comentarios por marcha --- */
    var ms = marchas();
    var c3 = card('Repertorio', ms.length ? ms.length + (ms.length===1?' marcha':' marchas') : 'vacío');
    if(ms.length){
      ms.forEach(function(m, i){
        var det = document.createElement('details');
        det.className = 'item';
        if(state.marchaAbierta === m.id) det.open = true;
        det.addEventListener('toggle', function(){ state.marchaAbierta = det.open ? m.id : null });
        det.innerHTML = '<summary><span class="nm">'+esc(m.titulo)+
          (m.autor || m.comentario ? '<small>'+esc([m.autor, m.comentario ? 'con notas' : ''].filter(Boolean).join(' · '))+'</small>' : '')+
          '</span></summary><div class="box"></div>';
        var box = det.querySelector('.box');
        var ta = document.createElement('textarea');
        ta.id = 'm-com-' + m.id;
        ta.placeholder = 'Qué mejorar: pasajes, respiraciones, dinámicas, tempo, quién entra dónde…';
        ta.value = m.comentario || '';
        ta.addEventListener('change', function(){
          var nx = clone(ms); nx[i].comentario = ta.value; saveMarchas(nx);
        });
        box.appendChild(ta);
        var acts = document.createElement('div'); acts.className = 'acts';
        var del = document.createElement('button');
        del.className = 'btn danger'; del.textContent = 'Quitar del repertorio';
        del.addEventListener('click', function(){
          if(!window.confirm('¿Quitar «'+m.titulo+'» del repertorio? Se pierden sus comentarios.')) return;
          var nx = clone(ms); nx.splice(i,1); saveMarchas(nx); render();
        });
        acts.appendChild(del);
        box.appendChild(acts);
        c3.body.appendChild(det);
      });
    } else {
      c3.body.innerHTML = '<div class="muted small">Todavía no hay marchas. Añade las del repertorio y cada una tendrá su sitio para apuntar qué hay que mejorar.</div>';
    }
    var fr = document.createElement('form');
    fr.className = 'formgrid'; fr.style.marginTop = '12px';
    fr.innerHTML = '<label class="wide">Marcha<input type="text" name="titulo" id="r-titulo" placeholder="Título" required></label>'+
      '<label class="wide">Autor<input type="text" name="autor" id="r-autor" placeholder="Compositor (opcional)"></label>'+
      '<div class="wide"><button class="btn primary" type="submit">Añadir al repertorio</button></div>';
    fr.addEventListener('submit', function(ev){
      ev.preventDefault();
      var t = fr.titulo.value.trim(); if(!t){ toast('Ponle el título'); return }
      var nx = clone(marchas());
      nx.push({id: uid(), titulo: t, autor: fr.autor.value.trim(), comentario: ''});
      nx.sort(function(a,b){ return a.titulo.localeCompare(b.titulo, 'es') });
      saveMarchas(nx); fr.reset(); render();
    });
    c3.body.appendChild(fr);
    s.appendChild(c3);
    return s;
  }

  /* ============ ESTUDIO ============ */
  function viewEstudio(){
    var s = stack();
    var carMin = 0;
    weekDates().forEach(function(dt){
      blocksOf(iso(dt)).forEach(function(b){ if(b.cat==='trayecto') carMin += dur(b.ini,b.fin) });
    });
    s.appendChild(banner({
      img:'estudio', alt:'Carretera de la serranía al atardecer', title:'Estudio en el coche', eyebrow:'Audio-estudio',
      sub:'Ronda–Antequera son unos 70 minutos por sentido',
      chips:'<span class="chip">Volante esta semana <b>'+hrs(carMin)+'</b></span>'
    }));

    /* --- recomendados de la semana, con comentarios --- */
    var rec = d('recomendados');
    var items = (rec && rec.items) || [];
    var cr = card('Recomendados de la semana', items.length ? items.length + ' para el coche' : 'sin recomendaciones');
    if(items.length){
      items.forEach(function(it, i){
        var det = document.createElement('details');
        det.className = 'item';
        if(state.recAbierto === i) det.open = true;
        det.addEventListener('toggle', function(){ state.recAbierto = det.open ? i : null });
        det.innerHTML = '<summary><span class="nm">'+esc(it.titulo)+
          '<small>'+esc([it.fuente, it.duracion].filter(Boolean).join(' · '))+'</small></span>'+
          '<button class="state" data-s="'+esc(it.estado||'pendiente')+'">'+esc(it.estado||'pendiente')+'</button>'+
          '</summary><div class="box"></div>';
        det.querySelector('.state').addEventListener('click', function(ev){
          ev.preventDefault(); ev.stopPropagation();
          var order = ['pendiente','escuchando','hecho'];
          var nx = clone(rec);
          nx.items[i].estado = order[(order.indexOf(it.estado || 'pendiente') + 1) % 3];
          save('recomendados', nx); render();
        });
        var box = det.querySelector('.box');
        if(it.porque) box.appendChild(h('<p class="porque">'+esc(it.porque)+'</p>').firstChild);
        if(it.url) box.appendChild(h('<p class="porque"><a href="'+esc(it.url)+'" target="_blank" rel="noopener">Abrir</a></p>').firstChild);
        var ta = document.createElement('textarea');
        ta.id = 'rec-com-' + i;
        ta.placeholder = 'Qué te has llevado: ideas, datos, qué aplicar…';
        ta.value = it.comentario || '';
        ta.addEventListener('change', function(){
          var nx = clone(rec); nx.items[i].comentario = ta.value; save('recomendados', nx);
        });
        box.appendChild(ta);
        cr.body.appendChild(det);
      });
    } else {
      cr.body.innerHTML = '<div class="muted small">Esta semana no hay recomendaciones cargadas. Llegan con la agenda del domingo, y cada una trae su hueco para apuntar lo que saques.</div>';
    }
    s.appendChild(cr);

    var lib = store.estudio || {items:[]};
    var pend = (lib.items||[]).filter(function(i){ return i.estado !== 'hecho' }).length;
    var c = card('Biblioteca', pend + ' pendientes');
    if((lib.items||[]).length){
      (lib.items||[]).forEach(function(it, i){
        var det = document.createElement('details');
        det.className = 'item';
        if(state.libAbierto === i) det.open = true;
        det.addEventListener('toggle', function(){ state.libAbierto = det.open ? i : null });
        det.innerHTML = '<summary><span class="nm">'+esc(it.titulo)+
          '<small>'+esc([it.tipo, it.fuente, it.duracion].filter(Boolean).join(' · '))+'</small></span>'+
          '<button class="state" data-s="'+esc(it.estado||'pendiente')+'">'+esc(it.estado||'pendiente')+'</button>'+
          '</summary><div class="box"></div>';
        det.querySelector('.state').addEventListener('click', function(ev){
          ev.preventDefault(); ev.stopPropagation();
          var order = ['pendiente','escuchando','hecho'];
          var nx = clone(lib);
          nx.items[i].estado = order[(order.indexOf(it.estado || 'pendiente') + 1) % 3];
          saveEstudio(nx); render();
        });
        var box = det.querySelector('.box');
        var ta = document.createElement('textarea');
        ta.id = 'lib-com-' + i;
        ta.placeholder = 'Comentarios: qué te ha parecido, qué aplicar…';
        ta.value = it.comentario || '';
        ta.addEventListener('change', function(){
          var nx = clone(lib); nx.items[i].comentario = ta.value; saveEstudio(nx);
        });
        box.appendChild(ta);
        var acts = document.createElement('div'); acts.className = 'acts';
        var del = document.createElement('button');
        del.className = 'btn danger'; del.textContent = 'Borrar';
        del.addEventListener('click', function(){
          var nx = clone(lib); nx.items.splice(i,1); saveEstudio(nx); render();
        });
        acts.appendChild(del); box.appendChild(acts);
        c.body.appendChild(det);
      });
    } else {
      c.body.innerHTML = '<div class="muted small">La biblioteca está vacía. Añade lo primero que quieras escuchar en el coche.</div>';
    }

    var row = document.createElement('div'); row.className='addrow';
    var inp = document.createElement('input');
    inp.id='newstudy'; inp.placeholder='Añadir: podcast, clase o libro'; inp.setAttribute('aria-label','Nuevo contenido');
    var add = document.createElement('button'); add.className='btn primary'; add.textContent='Añadir';
    function addItem(){
      var t = inp.value.trim(); if(!t) return;
      var nx = clone(store.estudio || {items:[]});
      nx.items = nx.items || [];
      nx.items.unshift({titulo:t, tipo:'', fuente:'', duracion:'', estado:'pendiente', comentario:''});
      inp.value='';
      saveEstudio(nx); render();
    }
    add.addEventListener('click', addItem);
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); addItem() } });
    row.appendChild(inp); row.appendChild(add);
    c.body.appendChild(row);
    s.appendChild(c);
    return s;
  }

  /* ============ DATOS: exportar / importar ============ */
  function countWeeks(){ return Object.keys(store.semanas || {}).length }
  function storeBytes(){ try{ return new Blob([JSON.stringify(store)]).size }catch(e){ return 0 } }

  function viewDatos(){
    var s = stack();
    var c = card('Tus datos', 'solo en este dispositivo');
    c.body.innerHTML =
      '<p class="small muted" style="margin:0 0 10px">Todo lo que ves en la app se guarda en el almacenamiento de este navegador. No sale a ningún servidor, así que nadie que abra la dirección web ve tus datos. El precio: si borras los datos del navegador o cambias de móvil, se pierden. Exporta de vez en cuando.</p>';
    var kv = document.createElement('ul'); kv.className='kv';
    kv.innerHTML =
      '<li><span>Semanas guardadas</span><span class="v">'+countWeeks()+'</span></li>'+
      '<li><span>Contenidos de estudio</span><span class="v">'+((store.estudio && store.estudio.items) || []).length+'</span></li>'+
      '<li><span>Mediciones</span><span class="v">'+medidas().length+'</span></li>'+
      '<li><span>Marchas en el repertorio</span><span class="v">'+marchas().length+'</span></li>'+
      '<li><span>Tamaño</span><span class="v">'+(storeBytes()/1024).toFixed(1)+' KB</span></li>'+
      '<li><span>Último guardado</span><span class="v">'+(store.meta && store.meta.guardado ? new Date(store.meta.guardado).toLocaleString('es-ES') : '—')+'</span></li>'+
      '<li><span>Almacenamiento</span><span class="v">'+(storageOk ? 'disponible' : 'bloqueado')+'</span></li>';
    c.body.appendChild(kv);
    s.appendChild(c);

    var c2 = card('Llevártelo a otro dispositivo');
    c2.body.innerHTML = '<p class="small muted" style="margin:0">Exporta un archivo .json, pásalo al móvil nuevo (email, WhatsApp, USB, Drive) y ábrelo desde «Importar» en el otro dispositivo.</p>';
    var row = document.createElement('div'); row.className='btnrow';

    var exp = document.createElement('button');
    exp.className='btn primary'; exp.textContent='Exportar copia';
    exp.addEventListener('click', exportar);

    var impMerge = document.createElement('button');
    impMerge.className='btn'; impMerge.textContent='Importar y combinar';
    impMerge.addEventListener('click', function(){ pickFile('merge') });

    var impRep = document.createElement('button');
    impRep.className='btn'; impRep.textContent='Restaurar (reemplaza todo)';
    impRep.addEventListener('click', function(){ pickFile('replace') });

    row.appendChild(exp); row.appendChild(impMerge); row.appendChild(impRep);
    c2.body.appendChild(row);
    c2.body.appendChild(h('<div class="hint">Combinar: las semanas del archivo sustituyen a las mismas semanas que ya tengas y el resto se conserva. Restaurar: se borra lo de este dispositivo y queda exactamente lo del archivo.</div>').firstChild);
    s.appendChild(c2);

    var c3 = card('Borrar');
    var row2 = document.createElement('div'); row2.className='btnrow'; row2.style.marginTop='0';
    var del = document.createElement('button');
    del.className='btn danger'; del.textContent='Borrar todos los datos de este dispositivo';
    del.addEventListener('click', function(){
      if(!window.confirm('Se borra todo lo guardado en este dispositivo. ¿Seguro? Exporta primero si quieres conservarlo.')) return;
      store = base();
      try{ localStorage.removeItem(KEY) }catch(e){}
      toast('Datos borrados');
      render();
    });
    row2.appendChild(del);
    c3.body.appendChild(row2);
    s.appendChild(c3);
    return s;
  }

  function exportar(){
    try{
      var data = JSON.stringify(store, null, 2);
      var blob = new Blob([data], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'agenda-personal-' + iso(new Date()) + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url) }, 4000);
      toast('Copia exportada');
    }catch(e){ toast('No se pudo exportar en este navegador') }
  }

  var importMode = 'merge';
  function pickFile(mode){
    importMode = mode;
    var f = document.getElementById('importfile');
    f.value = '';
    f.click();
  }
  document.getElementById('importfile').addEventListener('change', function(ev){
    var file = ev.target.files && ev.target.files[0];
    if(!file) return;
    var r = new FileReader();
    r.onload = function(){
      var inc;
      try{ inc = JSON.parse(String(r.result)) }
      catch(e){ toast('Ese archivo no es una copia válida'); return }
      if(!inc || typeof inc !== 'object' || (!inc.semanas && !inc.estudio)){
        toast('Ese archivo no parece una copia de tu agenda'); return;
      }
      if(importMode === 'replace'){
        if(!window.confirm('Se reemplaza todo lo de este dispositivo por el contenido del archivo. ¿Seguir?')) return;
        store = {
          meta: inc.meta || {app:'semana-serrana', version:1},
          semanas: inc.semanas || {},
          estudio: inc.estudio || {items:[]},
          medidas: inc.medidas || {registros:[]},
          repertorio: inc.repertorio || {marchas:[]},
          config: inc.config || {}
        };
        persist();
        toast('Copia restaurada: ' + Object.keys(store.semanas).length + ' semanas');
      } else {
        var nw = 0;
        Object.keys(inc.semanas || {}).forEach(function(k){
          var mine = store.semanas[k] || {};
          var theirs = inc.semanas[k] || {};
          Object.keys(theirs).forEach(function(mod){ mine[mod] = theirs[mod] });
          store.semanas[k] = mine; nw++;
        });
        var items = (store.estudio && store.estudio.items) || [];
        var have = {};
        items.forEach(function(i){ have[(i.titulo||'').toLowerCase()] = true });
        ((inc.estudio && inc.estudio.items) || []).forEach(function(i){
          if(!have[(i.titulo||'').toLowerCase()]) items.unshift(i);
        });
        store.estudio = {items:items};

        // medidas: se combinan por fecha, gana la del archivo
        var regs = medidas().slice();
        ((inc.medidas && inc.medidas.registros) || []).forEach(function(r){
          regs = regs.filter(function(x){ return x.fecha !== r.fecha });
          regs.push(r);
        });
        regs.sort(function(a,b){ return a.fecha < b.fecha ? -1 : 1 });
        store.medidas = {registros:regs};

        // repertorio: se añaden las marchas que falten, sin tocar tus comentarios
        var mar = marchas().slice();
        var tengo = {};
        mar.forEach(function(m){ tengo[(m.titulo||'').toLowerCase()] = true });
        ((inc.repertorio && inc.repertorio.marchas) || []).forEach(function(m){
          if(!tengo[(m.titulo||'').toLowerCase()]) mar.push(m);
        });
        store.repertorio = {marchas:mar};

        if(inc.config) Object.keys(inc.config).forEach(function(k){ store.config[k] = inc.config[k] });
        persist();
        toast('Importado: ' + nw + ' semana' + (nw===1?'':'s'));
      }
      render();
    };
    r.onerror = function(){ toast('No se pudo leer el archivo') };
    r.readAsText(file);
  });

  /* ============ arranque ============ */
  document.getElementById('prevw').addEventListener('click', function(){ state.monday = addDays(state.monday,-7); render() });
  document.getElementById('nextw').addEventListener('click', function(){ state.monday = addDays(state.monday,7); render() });
  document.getElementById('thisw').addEventListener('click', function(){ state.monday = mondayOf(new Date()); render() });
  document.getElementById('datosbtn').addEventListener('click', function(){ go(state.tab === 'datos' ? 'hoy' : 'datos') });

  /* ---------- tema claro / oscuro ---------- */
  var LUNA = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>';
  var SOL = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10l1.4 1.4m0-12.8l-1.4 1.4m-10 10l-1.4 1.4"/></svg>';
  var themeBtn = document.getElementById('themebtn');
  function pintaTema(t){
    document.documentElement.setAttribute('data-theme', t);
    themeBtn.innerHTML = t === 'dark' ? SOL : LUNA;
    themeBtn.title = t === 'dark' ? 'Pasar a claro' : 'Pasar a oscuro';
  }
  function temaGuardado(){
    try{ return localStorage.getItem('semana-serrana.tema') || 'light' }catch(e){ return 'light' }
  }
  pintaTema(temaGuardado());
  themeBtn.addEventListener('click', function(){
    var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    try{ localStorage.setItem('semana-serrana.tema', t) }catch(e){}
    pintaTema(t);
  });

  loadStore();
  render();
  if(!storageOk) toast('Este navegador no deja guardar datos: lo que toques no se conservará');

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
